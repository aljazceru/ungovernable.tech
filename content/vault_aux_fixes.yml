content/briefings/naming/2026-09-14.md:
  replace:
  - new: |-
      ### 3. ENSv2 remains on Ethereum L1

      ENS’s Surge proposal is dated 17 November 2025. Its later announcement, on 6 February 2026, says ENSv2 will deploy exclusively on Ethereum L1 and Namechain development will cease. The older proposal does not establish a September revival. See [ENS](/kb/ens/).
    old: |-
      ### 3. ENS→Namechain → Nethermind Surge — fresh writeups clarify the stack

      Nethermind's Sep 2026 [LinkedIn post on the ENS collaboration](https://www.linkedin.com/posts/nethermind_ens-is-launching-namechain-a-zk-rollup-built-activity-7396174027637182465-TNkH) formalizes:

      > "ENS is launching Namechain, a ZK rollup built for ENS, and has decided to deploy it as a based rollup using Surge, the Ethereum native rollup framework developed by Nethermind on top of the Taiko Labs stack. […] Nethermind is acting as the infrastructure architect and builder for Namechain. Our work focuses on: The Nethermind Client as a foundational execution layer component. Surge as the based rollup framework powering Namechain. The infrastructure and operations needed to run the […]"

      ENS's [blog post "Why We're Moving Namechain to Nethermind's Surge"](https://ens.domains/blog/post/namechain-nethermind-surge) confirms:

      > "Namechain, the ZK rollup built for ENS, will be deployed using Surge, a based rollup framework developed by Nethermind and built on the Taiko stack. […] By adopting Surge's based rollup model from the start, we ensure that Namechain inherits Ethereum's decentralization, liveness, and neutrality without compromise. This means we can launch as a Stage 1 rollup with a clear path to Stage 2. […] as among the first protocols to launch as a based rollup, demonstrating that an L2 can be built without compromises on decentralization or security."

      **Trade-off (per ENS blog)**: "This isn't an easier path, as it requires more complex engineering, deeper coordination with Ethereum's roadmap, and potentially accepting some initial performance tradeoffs. But all this means we will be on a faster path to our vision of fully decentralized [naming]."

      This is **post-Dec 31, 2025** content formally post-dated; the ENSv2 audit competition scope is the new ENS App + ENS Explorer (Sepolia testnet, app layer) and the v2 contracts (L1), not Namechain itself — Namechain is the L2 the contracts will eventually settle to. The deployment sequence (audit close → mainnet v2 contracts → Namechain testnet → Namechain mainnet) is not yet a published calendar; this Sep writeup just confirms the architecture choice.

      **Cross-reference**: [ENS](/kb/ens/) (ENSv2 timeline); Sep 7 weekly §"Namechain" mentions the stage-1 launch with Stage-2 path. The 2-stage rollup progression is the typical Taiko model — Stage 1 uses a Security Council with forced exit mechanisms; Stage 2 removes the council and uses purely trust-minimized proofs.
  - new: '- **ENSv2 and Namechain**: ENS’s February 2026 announcement places ENSv2 on Ethereum L1 and
      ends Namechain development. The Surge proposal dates from November 2025.'
    old: '- **ENS→Namechain → Nethermind Surge writeups**: Nethermind''s Sep LinkedIn post formalizes
      its role as Namechain architect/builder — Surge is the based-rollup framework on top of Taiko Labs''
      stack, Nethermind Client as foundational execution layer. ENS blog post "Why We''re Moving Namechain
      to Nethermind''s Surge" confirms Stage-1 launch with explicit Stage-2 path and the trade-off of
      "more complex engineering, deeper coordination with Ethereum''s roadmap, and potentially accepting
      some initial performance tradeoffs." See §3.'
