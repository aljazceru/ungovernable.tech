# Learning paths by persona. Each step is an entry or guide slug plus why it is on the path.
- key: under-surveillance
  name: Under Surveillance
  who: Activists, journalists, organisers and dissidents whose communications are, or may be, watched.
  intro: Surveillance is cheap, automatic and increasingly targeted. This path hardens the device first, then your communications, then your movement across the network, because each layer depends on the one beneath it.
  steps:
    - {slug: threat-modeling, why: "Decide who you are defending against before choosing tools."}
    - {slug: grapheneos, why: "Your phone is the most likely point of compromise; harden it first."}
    - {slug: passkeys-and-security-keys, why: "Choose account credentials and plan how to recover after losing a device or key."}
    - {slug: choosing-a-secure-messenger, why: "Pick a messenger by what it reveals about you, not just whether it encrypts."}
    - {slug: compare-messengers, why: "Compare identifiers, delivery services, encryption defaults and offline operation."}
    - {slug: metadata-resistance, why: "Understand why who-talks-to-whom matters as much as what is said."}
    - {slug: using-tor-safely, why: "Hide what you read and where you are from the network and the sites you visit."}
    - {slug: tails-qubes-whonix, why: "When one mistake is catastrophic, let the operating system enforce discipline."}
    - {slug: onionshare, why: "Understand the host and access-key trust model before sharing files over Tor."}
    - {slug: securedrop, why: "Learn the separate source, newsroom and isolated-viewing roles for confidential submissions."}
    - {slug: sanitizing-documents, why: "Review metadata and redaction before sharing sensitive documents."}
    - {slug: encrypting-files-and-backups, why: "Make a seized or stolen device worthless to whoever holds it."}
    - {slug: private-file-sync-and-backup, why: "Keep working copies on chosen devices and test a separate offline recovery copy."}
    - {slug: browser-and-network-privacy, why: "Remove the commercial tracking that feeds data brokers and investigators."}
    - {slug: map-threat-models, why: "A map of the adversaries, trust assumptions and failure modes across this library."}
    - {slug: suspected-device-compromise, why: "Prepare a response plan with trusted communication, evidence preservation and expert help."}
- key: behind-the-firewall
  name: Behind the Firewall
  who: People in countries that block websites, fingerprint VPNs or switch the internet off.
  intro: Censorship is an arms race. This path explains how blocking works, which disguises defeat which blocks, and what to prepare for the day the network goes dark entirely.
  steps:
    - {slug: censorship-circumvention, why: "Match the circumvention tool to the blocking technique you face."}
    - {slug: ooni, why: "Read existing measurements and understand the risks before collecting your own."}
    - {slug: pluggable-transports, why: "Compare Tor entry routes and learn how to obtain and use bridges."}
    - {slug: psiphon, why: "Assess a managed circumvention service and its operator trust model."}
    - {slug: outline, why: "Understand private server access keys and who operates the proxy."}
    - {slug: wireguard, why: "Learn what an encrypted tunnel protects and why it can still be blocked."}
    - {slug: self-hosted-circumvention-server, why: "Set up and test a route for people you know, with a recovery plan."}
    - {slug: using-tor-safely, why: "Tor with bridges gives you access and anonymity at once."}
    - {slug: tor, why: "How Tor, its bridges and pluggable transports work underneath."}
    - {slug: internet-shutdown-preparedness, why: "What to install and agree on before the network is switched off."}
    - {slug: kiwix, why: "Prepare a reference library that can be read without an internet connection."}
    - {slug: briar, why: "A messenger that keeps working over Bluetooth and Wi-Fi when the internet does not."}
    - {slug: building-a-mesh, why: "Cheap LoRa radios give a group a text network with no infrastructure."}
    - {slug: off-grid-messaging, why: "The wider landscape of offline and delay-tolerant messaging."}
    - {slug: map-censorship-resistance, why: "How naming, storage, transport and messaging combine into censorship resistance."}
- key: sovereign-money
  name: Sovereign Money
  who: Anyone who wants to hold and move value without asking permission, and without broadcasting their finances.
  intro: Money that cannot be frozen requires keys you hold, a node you run, and habits that keep your history private. This path goes from first principles to self-custody to private payments.
  steps:
    - {slug: financial-sovereignty, why: "The landscape: custody, privacy and censorship-resistant payments."}
    - {slug: bitcoin-self-custody, why: "A step-by-step setup that balances security, privacy and recovery."}
    - {slug: compare-p2p-bitcoin-acquisition, why: "Compare Bisq, RoboSats and other acquisition routes by custody, identity checks and payment privacy."}
    - {slug: hardware-wallets, why: "How signing devices work and where their trust boundaries lie."}
    - {slug: coinjoin, why: "On-chain privacy techniques for Bitcoin and their current legal context."}
    - {slug: silent-payments, why: "Use a reusable Bitcoin address while understanding scanning and wallet compatibility."}
    - {slug: lightning-network, why: "Fast, cheap payments, and what they reveal."}
    - {slug: btcpay-server, why: "Accept payments into your wallet and understand the responsibility of running the processor."}
    - {slug: cashu-ecash, why: "Chaumian ecash: near-cash privacy, in exchange for trusting a mint."}
    - {slug: fedimint, why: "Compare guardian custody and Lightning gateway contracts with the trust in a single mint."}
    - {slug: monero, why: "A currency where privacy is the default for every transaction."}
    - {slug: zcash, why: "Understand shielded pools, viewing keys and the information revealed at pool boundaries."}
    - {slug: threshold-signatures, why: "The cryptography behind multisig, FROST and shared custody."}
    - {slug: blockstream-satellite, why: "Receive Bitcoin data during internet outages while planning a separate path for sending transactions."}
    - {slug: bitcoin-post-quantum-migration, why: "What a future quantum computer would mean for coins held today."}
- key: node-runner
  name: Node Runner
  who: Operators who want to add capacity and independence to free networks.
  intro: Decentralised networks are decentralised because many independent people run them. This path covers what to run, what it costs and what risks each role carries.
  steps:
    - {slug: running-freedom-infrastructure, why: "From a Snowflake proxy to Tor relays, Bitcoin nodes and mesh repeaters."}
    - {slug: self-hosted-circumvention-server, why: "Choose between a private gateway, a Tor bridge and a Snowflake proxy."}
    - {slug: pluggable-transports, why: "Understand the transports your bridge users may need."}
    - {slug: openwrt, why: "Check router hardware support and plan firmware and package upgrades."}
    - {slug: startos, why: "Consider a personal-server interface with documented service, backup and remote-access workflows."}
    - {slug: yunohost, why: "Compare another server administration approach and its application isolation limits."}
    - {slug: tor, why: "The network most in need of diverse, independent relays."}
    - {slug: i2p, why: "A network where every router carries traffic for others."}
    - {slug: nym, why: "Incentivised mixnet node roles and how they are rewarded."}
    - {slug: building-a-mesh, why: "Place solar repeaters that cover a neighbourhood."}
    - {slug: reticulum, why: "Transport nodes that bridge radio meshes with each other and the internet."}
    - {slug: uncensorable-website, why: "Host and mirror content so that no single takedown works."}
    - {slug: compare-storage, why: "Choose storage by who retains the data and what retrieval depends on."}
    - {slug: bittorrent-archives, why: "Plan seeds and web seeds for distributing fixed archive copies."}
    - {slug: tahoe-lafs, why: "Understand capability recovery, share placement and storage-grid operation."}
    - {slug: decentralized-compute, why: "Renting out compute: what is real capacity and what is token theatre."}
    - {slug: xmpp-omemo, why: "Understand what running a messaging server changes, and which metadata it still sees."}
- key: builder
  name: Builder
  who: Developers and engineers designing systems that should not need to be trusted.
  intro: "The strongest systems combine primitives: anonymity networks with encryption, TEEs with attestation, cryptography that computes on data it cannot see. This path covers the building blocks and how they compose."
  steps:
    - {slug: map-composing-primitives, why: "How the primitives in this library combine, and where compositions fail."}
    - {slug: local-first-crdts, why: "Separate offline editing and automatic merging from encryption and access control."}
    - {slug: hypercore, why: "Assess signed log replication, file APIs and peer discovery for an application."}
    - {slug: ipns-dnslink, why: "Publish changing content under a stable key-based or DNS-based name."}
    - {slug: zero-knowledge-proofs, why: "Prove statements without revealing the data behind them."}
    - {slug: multi-party-computation, why: "Compute jointly on private inputs without a trusted party."}
    - {slug: fully-homomorphic-encryption, why: "Compute on encrypted data directly."}
    - {slug: private-information-retrieval, why: "Query a database without the server learning what you asked for."}
    - {slug: confidential-computing, why: "Hardware isolation, and what it does and does not protect."}
    - {slug: remote-attestation, why: "How to verify what code is running on a machine you do not control."}
    - {slug: tee-side-channel-attacks, why: "The attacks that keep breaking enclaves."}
    - {slug: post-quantum-cryptography, why: "Plan migrations now for data that must stay secret for years."}
    - {slug: hybrid-kem-migration, why: "The practical path to post-quantum key exchange."}
    - {slug: veilid, why: "Separate a private-routing framework from the security responsibilities of an application."}
- key: sovereign-identity
  name: Sovereign Identity
  who: People who want to own their identity, audience and reputation instead of renting them from platforms.
  intro: Keys instead of accounts. This path covers creating and protecting a key-based identity, carrying your audience between apps, and building trust without a central authority.
  steps:
    - {slug: identity-and-pseudonymity, why: "Why pseudonymity matters and how identities get linked."}
    - {slug: nostr-getting-started, why: "Create a Nostr identity safely, with your key kept out of apps."}
    - {slug: nostr-key-custody, why: "Long-term custody and recovery for keys that cannot be reset."}
    - {slug: remote-signing, why: "Keep the key on a separate device and sign remotely."}
    - {slug: web-of-trust, why: "Reputation and spam resistance without a central authority."}
    - {slug: decentralized-identity, why: "DIDs, verifiable credentials and the standards world."}
    - {slug: pkarr, why: "Turn a public key into a domain name."}
    - {slug: proof-of-personhood, why: "Proving you are a unique human without revealing who you are."}
