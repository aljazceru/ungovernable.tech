  - title: 'FIPS 204: ML-DSA'
    url: https://csrc.nist.gov/pubs/fips/204/final
  - title: 'FIPS 205: SLH-DSA'
    url: https://csrc.nist.gov/pubs/fips/205/final
  - title: NIST post-quantum signature standardization
    url: https://csrc.nist.gov/projects/post-quantum-cryptography/selected-algorithms-2022
  - title: 'Shor: polynomial-time algorithms for factoring and discrete logarithms'
