opaque-and-pake:
  replace:
  - old: In aPAKE variants, the server stores a value that does not enable a server-side dictionary attack.
    new: In aPAKE variants, the server stores a registration record instead of the plaintext password. Full server compromise can still permit offline password guessing.
  - old: RFC 9710 (2024)
    new: CFRG Internet-Draft
  - old: no offline crack pre-compromise
    new: resists precomputation; full compromise permits guessing
  - old: 'The "strong" qualifier matters: vanilla aPAKE schemes including SRP allow a server-side breach to enable offline dictionary attacks. OPAQUE is the first widely-adopted PAKE that resists this.'
    new: OPAQUE resists precomputed password attacks before server compromise. After full compromise, including the server’s OPRF secret, an attacker can test guesses offline; key stretching raises the cost per guess.
  - old: Haase and Labrique, *AuCPace*. Standardized as **RFC 9710** (April 2024) under the CFRG CPace track.
    new: CPace is specified in the CFRG Internet-Draft `draft-irtf-cfrg-cpace`.
  - old: Standardized as **RFC 9807** (March 2025)
    new: Published as the informational IRTF **RFC 9807** (July 2025)
  - old: 'Core idea: combine an Oblivious PRF (OPRF) with an authenticated key exchange. Registration:


      ```

      client:  rwd = H(password, OPRF(server_oprf_key, password))

      client:  envelope = AEAD(rwd, key_pair_for_login)

      client → server: store(envelope, oprf_key_per_user)

      ```


      Login:


      ```

      client → server: OPRF eval blind for password

      server → client: oprf_response (without learning password)

      client:  rwd = H(password, OPRF eval)

      client:  decrypt envelope → long-term keypair

      both:   AKE using the keypair

      ```


      Properties:


      - Server never sees the password or anything from which it can derive the password offline. The OPRF binds the password evaluation to the server''s secret OPRF key, which is what blocks pre-computation: an attacker who steals the database must still query a (potentially rate-limited) OPRF online for each guess, or must additionally steal the OPRF key.

      - Even with both database and OPRF key stolen, the work factor is one OPRF per guess plus one AEAD decryption — defenders can pick a slow OPRF and a memory-hard KDF (Argon2id) inside the envelope to make brute force expensive.

      - Composable AKE: the IETF spec permits 3DH and HMQV-style instantiations. Reference uses 3DH over `ristretto255` or `decaf448`.


      ### Cipher suites in RFC 9807


      | Suite | Group | OPRF | AKE | Hash |

      |-------|-------|------|-----|------|

      | `OPAQUE-3DH-Ristretto255-SHA512` | ristretto255 | ristretto255 OPRF | 3DH | SHA-512 |

      | `OPAQUE-3DH-Decaf448-SHAKE256` | decaf448 | decaf448 OPRF | 3DH | SHAKE-256 |

      | `OPAQUE-3DH-P256-SHA256` | NIST P-256 | P-256 OPRF | 3DH | SHA-256 |

      | `OPAQUE-3DH-P384-SHA384` | NIST P-384 | P-384 OPRF | 3DH | SHA-384 |

      | `OPAQUE-3DH-P521-SHA512` | NIST P-521 | P-521 OPRF | 3DH | SHA-512 |

      '
    new: 'Core idea: combine an Oblivious PRF (OPRF), credential recovery, and authenticated key exchange. The client blinds its password for the OPRF exchange, derives a randomized password, and uses it to recover authentication credentials. The server does not receive the plaintext password, including during registration.


      RFC 9807’s envelope contains a nonce and authentication tag. The client derives its private key and authenticates the associated credentials; the envelope is not simply an AEAD-encrypted private-key blob.


      The RFC specifies a 3DH instantiation. Implementations must agree on the OPRF, group, hash, KDF, MAC and key-stretching parameters. Full server compromise permits offline guessing, while separating the OPRF secret into a rate-limited protected service can change that deployment’s compromise boundary.

      '
  - old: 'WhatsApp shipped end-to-end encrypted iCloud/Google Drive backups in 2021 using an HSM-backed PAKE-like protocol. Public materials describe a flow consistent with an OPRF + envelope (an OPAQUE-class design), with the OPRF evaluated by an HSM array. Offline attacks against the HSM-locked secrets are blocked unless an attacker compromises the HSM. This was a flagship deployment that pushed CFRG to finalize OPAQUE as a standard.


      Source: WhatsApp engineering whitepaper, *Security of End-to-End Encrypted Backups*, 2021.

      '
    new: 'WhatsApp’s published encrypted-backup design uses OPAQUE to authenticate password-based access to a backup-key vault protected by HSMs. Its guessing limits depend on that protected service, not on OPAQUE eliminating offline guessing after full compromise.

      '
  - old: '| Strong aPAKE (no offline crack from DB) | no | n/a | **yes** |'
    new: '| Resists password precomputation before server compromise | no | n/a | **yes** |'
  - old: '| RFC | 2945, 5054 (TLS) | 9710 | **9807** |'
    new: '| Specification | RFC 2945, 5054 (TLS) | CFRG CPace draft | RFC 9807 (informational) |'
  - old: AEAD soundness, KDF irreducibility
    new: MAC and KDF security
  - old: '**Argon2id inside the envelope is recommended**'
    new: '**Use the agreed key-stretching function**'
  sources:
  - title: 'RFC 2945: The SRP Authentication and Key Exchange System'
    url: https://www.rfc-editor.org/rfc/rfc2945.html
  - title: 'RFC 5054: Using SRP for TLS Authentication'
    url: https://www.rfc-editor.org/rfc/rfc5054.html
  - title: 'OPAQUE: An Asymmetric PAKE Protocol Secure Against Pre-Computation Attacks'
    url: https://eprint.iacr.org/2018/163
  - title: 'RFC 9807: The OPAQUE Asymmetric PAKE Protocol'
