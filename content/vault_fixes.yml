cashu-ecash:
  replace:
  - new: '- **Cryptographic basis**: Cashu uses Blind Diffie-Hellman Key Exchange (BDHKE) on secp256k1, as specified by NUT-00. For migration considerations, see [Post-Quantum Cryptography](/kb/post-quantum-cryptography/).'
    old: '- **Quantum**: Blind sig schemes (often RSA or similar in Cashu today) need PQ migration planning; symmetric parts inside proofs are easier.'
  - old: 'Works offline (send tokens via any transport: Nostr DM, USB, QR, LoRa).'
    new: Tokens can be transferred offline by QR, USB or another transport, but the recipient must contact the mint to swap them and establish that they have not already been spent.
  - old: '2026 milestone: first production-path "unruggable" mints running keys inside TEE enclaves.'
    new: Mint custody remains a central trust assumption.
  - old: "## 2026: TEE-protected \"unruggable\" mints\n\nClassic risk: the mint operator (or coerced) can:\n- Inflate supply (sign extra notes without reserves).\n- Steal backing BTC/LN.\n- Correlate users via timing/amounts if not careful (or log).\n\nMilestone (public testing reported by Cashu lead calle ~May/June 2026): first on-chain Cashu mint with keys generated and operated **entirely inside a TEE enclave** (e.g., Intel TDX/SEV-SNP or equivalent). \n\n- Mint operator never sees the signing keys.\n- Attestation proves the correct code is running.\n- Reserves can be on-chain / LN with enclave-controlled access.\n- Operator cannot unilaterally inflate or exit with funds.\n\nThis moves the trust from \"don't trust the mint operator\" toward \"trust the TEE + attestation + reproducible build + on-chain visibility of backing\".\n\nSee cross-reference: [Confidential-AI-Inference](/kb/confidential-ai-inference/) / [Overview - Confidential Computing](/kb/confidential-computing/) and TEE attestation\
      \ patterns. This is the canonical ungovernable composition of confidential compute + financial privacy primitive.\n\nStill early (testing/research at time of writing); production mints will need audits, transparency logs for attestation, and user-side verification of measurements."
    new: '## Mint custody and hardware protection


      Blind signatures protect the link between issuance and redemption; they do not prove reserves or prevent the mint from refusing redemption. Cashu users still trust the mint’s custody and availability.


      Running mint code in a TEE is a possible deployment pattern, not a guarantee supplied by Cashu. Attestation must be checked against a policy, and hardware, code, reserve custody and rollback behavior remain part of the threat model. See [Remote attestation](/kb/remote-attestation/) and [Confidential computing](/kb/confidential-computing/).'
  - old: Wallets store/receive/send tokens via Nostr events (gift-wrapped for privacy).
    new: Wallet state and token records use encrypted Nostr events as specified by NIP-60.
  - old: Nutzaps — Cashu-based zaps/tips over Nostr (private, no public LN invoice exposure).
    new: Nutzaps — Cashu tips using kind 9321 events. Recipient tags, sender identity and proofs in these events are public; the proofs are locked for the recipient.
  - old: '**Double-spend by receiver**: Prevented by mint tracking spent secrets (if you send the same proof twice, second fails).'
    new: '**Double-spend risk**: A sender can pass the same proof to multiple recipients. The mint rejects already-spent proofs; recipients need an online swap before treating payment as final.'
  - old: '| Cashu/Ecash   | Mint(s) + network observers | Yes    | Fixed + swaps    | Blind sigs + now TEE/federation | Small spends, tips, offline, private zaps |'
    new: '| Cashu/Ecash | Blindness against mint; transport metadata remains | Token transfer only; online check needed | Fixed + swaps | Blind signatures; mint remains custodian | Small transfers and tips |'
  - old: '## Sources & Evidence


      - Chaum original: "Blind Signatures for Untraceable Payments" (1982/83).

      - Cashu: protocol docs, NIPs 60/61 in nostr-protocol/nips; implementation repos under cashubtc org.

      - Fedimint: threshold/federated variant docs and code.

      - 2026 TEE milestone: public statements and testing notes from calle (Cashu lead); Socratic seminars and Nostr discussions covering design tradeoffs and attestation.

      - Client integrations: Amethyst release notes (v1.12+), Zeus PRs.

      - Primary verification: run/test mints, inspect proofs, check attestation measurements when TEE mints publish them.


      *Ecash is production for small values today; TEE/federated backing is the active research-to-deployment frontier that directly strengthens the ungovernable claim.*'
    new: ''
  sources:
  - title: 'Cashu NUT-00: blind Diffie-Hellman signatures and tokens'
    url: https://github.com/cashubtc/nuts/blob/main/00.md
  - title: 'Cashu NUT-03: token swaps and double-spend checking'
    url: https://github.com/cashubtc/nuts/blob/main/03.md
  - title: 'NIP-60: Cashu wallet events'
    url: https://github.com/nostr-protocol/nips/blob/master/60.md
  - title: 'NIP-61: Nutzaps'
    url: https://github.com/nostr-protocol/nips/blob/master/61.md
  - title: Cashu reference implementation
    url: https://github.com/cashubtc/nutshell
  - title: Fedimint implementation
    url: https://github.com/fedimint/fedimint
  - title: Amethyst releases
    url: https://github.com/vitorpamplona/amethyst/releases
  - title: Zeus releases
    url: https://github.com/ZeusLN/zeus/releases
  - title: 'Cashu FAQ: custody and mint trust'
    url: https://docs.cashu.space/faq
  - title: 'Chaum: Blind Signatures for Untraceable Payments'
    url: https://chaum.com/wp-content/uploads/2022/01/Chaum-blind-signatures.pdf
  - title: 'RFC 9334: Remote ATtestation procedureS Architecture'
    url: https://www.rfc-editor.org/rfc/rfc9334.html
  updated: '2026-10-25'

