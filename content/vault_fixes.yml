web-of-trust-survey:
  replace:
  - new: NIP-26 delegated event signing is marked unrecommended in the NIPs README. Historical discussion
      of revocation does not make it a recommended custody mechanism. NIP-46 remote signing does not require
      NIP-26.
    old: 'GitHub issue #654 on the NIPs repository proposes adding revocation to NIP-26 (Delegated Event
      Signing). The problem: NIP-26 currently only supports time-bounded expiry, not revocation. When
      NIP-46 bunker signers combine with long-expiry NIP-26 delegation keys for UX, a compromised delegate
      can operate until natural expiry. The proposed fix — root-key-signed revocation certificates distributed
      to relays — would let the root key burn a compromised delegate immediately without waiting for expiry.
      This is a meaningful gap in the current delegation model because NIP-26 delegation is central to
      the NIP-46 remote signing flow.'
  - new: NIP-26 remains an unrecommended proposal. Use the current NIPs README for its status rather than
      treating a historical revocation discussion as an endorsement of delegation.
    old: 'GitHub issue #654 in the NIPs repository remains open and active as of early June 2026. The
      proposed fix — root-key-signed revocation certificates distributed to relays — would let a delegating
      key immediately invalidate a compromised delegate key before its natural expiry. This matters directly
      for WoT-adjacent custody: if a delegate key is used for NIP-46 remote signing or NIP-07 identity,
      and that delegate gets compromised, the window of abuse is currently bounded only by the delegation''s
      expiry timestamp. Until this NIP is merged and widely implemented, long-expiry NIP-26 delegations
      combined with NIP-46 bunker signers represent a known revocation gap.'
  - new: |-
      ## Primary sources

      - [NIPs README: NIP-26 status](https://github.com/nostr-protocol/nips)
      - [NIP-46 remote signing](https://github.com/nostr-protocol/nips/blob/master/46.md)
    old: '## Primary sources'
  updated: '2026-10-25'
