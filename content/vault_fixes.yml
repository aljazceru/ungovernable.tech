nostr-web-of-trust:
  replace:
  - new: The NIPs README marks NIP-26 delegated event signing as unrecommended. Historical discussion
      of revocation does not make delegation a recommended custody mechanism. NIP-46 remote signing does
      not require NIP-26.
    old: 'GitHub issue #654 on the NIPs repository proposes a revocation mechanism for NIP-26 delegated
      keys. NIP-26 currently only supports time-bounded expiry, not revocation. When NIP-46 bunker signers
      use long-expiry NIP-26 delegation keys for UX, a compromised delegate can operate until natural
      expiry. The proposed fix — root-key-signed revocation certificates distributed to relays — would
      let the root key burn a compromised delegate immediately. This is important for the custody model
      because delegation is central to the NIP-46 flow, and currently delegation has no consent revocation
      path.'
  - new: NIP-26 is an unrecommended proposal. For current custody decisions, use the NIPs README and the
      NIP-46 remote-signing specification rather than treating the earlier revocation discussion as endorsement.
    old: 'GitHub issue #654 in the NIPs repository proposing a revocation mechanism for NIP-26 delegated
      keys remains open as of early June 2026. NIP-26 currently only supports time-bounded expiry, not
      revocation. When long-expiry NIP-26 delegations are combined with NIP-46 bunker signers for UX,
      a compromised delegate can operate until natural expiry — the proposed root-key-signed revocation
      certificates distributed to relays would close this window. This is a known gap in Nostr''s delegation
      model that matters directly for WoT-adjacent custody: NIP-26 delegation is central to the NIP-46
      remote signing flow, and without revocation, a compromised delegate is a live attack surface until
      expiry.'
  - new: |-
      ## Primary sources

      - [NIPs README: NIP-26 status](https://github.com/nostr-protocol/nips)
      - [NIP-46 remote signing](https://github.com/nostr-protocol/nips/blob/master/46.md)
