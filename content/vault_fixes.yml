nostr-identity:
  replace:
  - new: |-
      ### NIP-26 — unrecommended delegation

      NIP-26 describes delegated event signing, but the NIPs README marks it **unrecommended**. It should not be the basis of a new key-custody plan. For signing from a separate device, see [Nostr Key Custody and Recovery](/guides/nostr-key-custody/) and NIP-46 remote signing.
    old: |-
      ### NIP-26 — delegation

      The key holder signs a token authorizing another key to sign specific event kinds for a limited time. Useful for:

      - Hot signing keys that don't put the master key at risk.
      - Per-device keys that don't expose the root.
      - Application-specific signing scopes.

      NIP-26 is well-defined but client support is patchy.
  - new: '- Your own Android phone running Amber. Amber keeps the private key in a dedicated app on the
      device and signs for clients through Android signing interfaces and NIP-46; it is not a custodial
      hosting service.'
    old: '- A custodial service like Amber or Alby, which is convenient but means trusting a third party.'
  - new: '- **Use one `npub` for everything.** Reusing a public identity across contexts links those activities.
      Use separate keys when separation matters; NIP-26 delegation is unrecommended.'
    old: '- **Use one `npub` for everything.** Signing a transaction, posting a hot take, and broadcasting
      a FIPS routing announcement with the same key makes all three linkable. Use NIP-26 delegation or
      per-context keys when that matters.'
  - new: '- **Confuse a local signer with a custodian.** Amber keeps keys on your own device. Custody
      depends on who controls the signing device and its keys.'
    old: '- **Hand your key to a custodian.** A "Nostr account" hosted by Amber, Damus, or Iris that holds
      your key is a custodian. Not your keys, not your identity.'
  - new: '| Cross-context linkability | Separate keys for separate contexts; NIP-26 is unrecommended |'
    old: '| Cross-context linkability | Per-context keys, NIP-26 delegation |'
  - new: |-
