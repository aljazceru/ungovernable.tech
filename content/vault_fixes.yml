bitcoin-post-quantum-migration:
  replace:
  - new: P2PKH and P2WPKH outputs contain a public-key hash. P2TR outputs instead publish the tweaked public key when the output is created, before any spend.
    old: Hash-locked outputs (P2PKH, P2WPKH, P2TR) only expose the pubkey *when the output is spent*.
  - new: '| **P2TR** (Taproot) | At output creation | The output contains the 32-byte tweaked public key Q. Key-path spending verifies a Schnorr signature against Q; Q is a curve point, not a public-key hash. |'
    old: '| **P2TR** (Taproot) | After first spend | Address is the tweaked pubkey (`HASH(internal_pubkey \|\| merkle_root)`). On spend, the internal pubkey is revealed in some script paths. Key-path spends reveal less. |'
  - new: P2PKH, P2WPKH
    old: P2PKH, P2WPKH, P2TR key-path
  - new: Unspent Taproot outputs belong in the exposed-public-key category. Never spending from a Taproot address does not hide its output key.
    old: 'Estimates as of 2025: roughly 25-30% of all BTC sits in already-exposed pubkeys (P2PK + reused addresses). The rest is hash-protected, which buys time but not safety once a CRQC exists.'
  - new: '## Primary sources


      - [BIP 341: Taproot output keys and key-path validation](https://github.com/bitcoin/bips/blob/master/bip-0341.mediawiki)'
    old: '## Primary sources'
  - old: version 0.11.0 checked April 2026
    new: version 0.12.1 checked October 2026
  - old: 'P2MR script: OP_PUSHNUM_3 <32-byte Merkle root>'
    new: 'P2MR script: OP_2 OP_PUSHBYTES_32 <32-byte Merkle root>'
  - old: '**FN-DSA / Falcon** (draft FIPS 206)'
    new: '**FN-DSA / Falcon** (FIPS 206 under development)'
  - old: 'Cons: doubles signature size; doesn''t actually protect existing addresses; just adds PQ to new addresses.'
    new: 'Cons: adds the selected post-quantum signature''s size to the classical signature; does not retroactively protect existing outputs.'
  - old: '### Hard fork (deprecate vulnerable signatures)'
    new: '### Deprecating vulnerable signatures'
  - old: 'A more aggressive proposal: at a flag day, deprecate ECDSA and Schnorr signature acceptance entirely. All UTXOs must be migrated to PQ addresses by date X.'
    new: BIP-361 proposes a staged sunset of legacy signatures after a post-quantum output type is available. It describes the migration as a series of soft forks. Restricting previously valid spends does not inherently require a hard fork.
  - old: 4. Eventually hard-fork to deprecate ECDSA / Schnorr — but only after CRQC threat is imminent and coordination is feasible.
    new: 4. Consider a separately agreed sunset of legacy signatures; BIP-361 describes a soft-fork approach.
  - old: '- Hard-fork-to-deprecate option is politically untouchable for now.'
    new: '- A legacy-signature sunset requires a separate consensus decision.'
  - old: ~1.7M BTC sit in P2PK outputs (early Satoshi-era coins). All immediately at risk.
    new: ''
  - old: '- No clear answer for Satoshi-era P2PK coins (~1M+ BTC).'
    new: '- Treatment of unmigrated P2PK coins remains a separate policy question.'
  - old: Sapling/Orchard rely on BLS12-381 pairings; full PQ migration would be a redesign
    new: Sapling uses Groth16 over BLS12-381; Orchard uses Halo 2 over the Pasta curves. Both depend on quantum-vulnerable curve assumptions
  - old: '`github.com/bitcoin/bips/blob/master/bip-0360.mediawiki`'
    new: '[BIP 360: Pay-to-Merkle-Root](https://github.com/bitcoin/bips/blob/master/bip-0360.mediawiki)'
  updated: '2026-10-25'
  sources:
  - title: 'BIP 341: Taproot output keys and key-path validation'
    url: https://github.com/bitcoin/bips/blob/master/bip-0341.mediawiki
  - title: 'BIP 360: Pay-to-Merkle-Root'
    url: https://github.com/bitcoin/bips/blob/master/bip-0360.mediawiki
  - title: 'FIPS 203: ML-KEM'
