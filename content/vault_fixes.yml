verifiable-random-functions:
  replace:
  - old: 'RFC 9381 specifies five suites:'
    new: 'RFC 9381 specifies four ECVRF suites (and a separate RSA-FDH-VRF construction):'
  - old: '| `ECVRF-secp256k1-SHA256-TAI` | secp256k1 | try-and-increment |'
    new: ''
  - old: ECVRF specification with five cipher suites
    new: VRF specification with four ECVRF cipher suites
  - old: VRF removes the abort-bias problem of commit-reveal. The remaining bias surface is whether the operator can choose the input `α` adversarially. Pinning `α` to a recent block hash or beacon output (League of Entropy) closes this loop.
    new: A VRF fixes the output for a given public key and input, but the keyholder can still withhold an unfavorable result. Fixing the input in advance limits input grinding; a surrounding protocol must also address withholding.
  - old: '| Bias by aborting reveal | yes | n/a | n/a |'
    new: '| Bias by withholding a result | yes | possible | possible |'
  - old: '- `noble-curves` (Paul Miller) ships RFC 9381 ECVRF in pure JS/TS.'
    new: ''
