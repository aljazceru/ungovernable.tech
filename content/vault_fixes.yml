bitcoin-post-quantum-migration:
  replace:
  - new: P2PKH and P2WPKH outputs contain a public-key hash. P2TR outputs instead publish the tweaked
      public key when the output is created, before any spend.
    old: Hash-locked outputs (P2PKH, P2WPKH, P2TR) only expose the pubkey *when the output is spent*.
  - new: '| **P2TR** (Taproot) | At output creation | The output contains the 32-byte tweaked public key
      Q. Key-path spending verifies a Schnorr signature against Q; Q is a curve point, not a public-key
      hash. |'
    old: '| **P2TR** (Taproot) | After first spend | Address is the tweaked pubkey (`HASH(internal_pubkey
      \|\| merkle_root)`). On spend, the internal pubkey is revealed in some script paths. Key-path spends
      reveal less. |'
  - new: P2PKH, P2WPKH
    old: P2PKH, P2WPKH, P2TR key-path
  - new: Unspent Taproot outputs belong in the exposed-public-key category. Never spending from a Taproot
      address does not hide its output key.
    old: 'Estimates as of 2025: roughly 25-30% of all BTC sits in already-exposed pubkeys (P2PK + reused
      addresses). The rest is hash-protected, which buys time but not safety once a CRQC exists.'
  - new: |-
      ## Primary sources

      - [BIP 341: Taproot output keys and key-path validation](https://github.com/bitcoin/bips/blob/master/bip-0341.mediawiki)
    old: '## Primary sources'
  updated: '2026-10-25'
