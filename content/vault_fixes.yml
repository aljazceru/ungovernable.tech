identity-and-pseudonymity:
  replace:
  - new: |-
      **NIP-26: Delegated Event Signing — unrecommended**

      The NIPs README marks this proposal as unrecommended. The following describes the historical proposal, not a recommended custody pattern.
    old: '**NIP-26: Delegated Event Signing**'
  - new: '| **NIP-26 delegation** | Delegated event signing | Unrecommended | The NIPs README advises
      against it |'
    old: '| **NIP-26 delegation** | Agent / app delegation | Mature spec, patchy support | Useful for
      bounded agent/app permissions |'
  - new: NIP-26 is marked unrecommended in the NIPs README. Historical discussion of delegation revocation
      should not be read as current endorsement. NIP-46 remote signing does not depend on NIP-26 delegation.
    old: 'An open GitHub issue ([nostr-protocol/nips#654](https://github.com/nostr-protocol/nips/issues/654))
      proposes adding a revocation mechanism to NIP-26. The motivation is concrete: when using NIP-46
      for remote signing, users often combine it with long-expiry NIP-26 delegation keys for UX convenience.
      If a delegated key is compromised via XSS or other means, the fixed expiry date means attackers
      can continue using the delegation until it naturally expires — long enough to cause real damage.'
  - new: NIP-26 is unrecommended; its proposed extensions are not a basis for a new recovery plan. See
      [Nostr Key Custody and Recovery](/guides/nostr-key-custody/) for signing-device and custody considerations.
    old: 'NIP-26 currently has no revocation mechanism — only time-bounded expiry. GitHub issue #654 proposes
      adding a root-key-signed revocation certificate that clients and relays can validate. This would
      be a significant addition to the identity recovery toolkit: a compromised delegate key can be burned
      immediately rather than waiting for natural expiry. Until this lands as a NIP, the practical mitigation
      is using short-expiry delegations and monitoring for unexpected delegation use.'
  - new: 'This separates the data type from the profile blob:'
    old: 'This follows the pattern established by NIP-26 (delegation), NIP-85 (assertions), and NIP-51
      (lists):'
  - new: |-
      ## Primary sources

      - [NIPs README: NIP-26 status](https://github.com/nostr-protocol/nips)
      - [NIP-46 remote signing](https://github.com/nostr-protocol/nips/blob/master/46.md)
    old: '## Primary sources'
  updated: '2026-10-25'
