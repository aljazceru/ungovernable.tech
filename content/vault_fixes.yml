mesh-naming:
  replace:
  - old: '- Reference implementation `yggdrasil-go`: v0.5.x series, last release v0.5.12 (Dec 2024); active maintenance.'
    new: '- **Experimental.** Yggdrasil describes its software as alpha-stage and warns that future changes may break compatibility.'
  - new: Two overlay approaches are Yggdrasil
    old: The two production answers are Yggdrasil
  - new: '- **Yggdrasil** — experimental, alpha-stage software; future changes may break compatibility.'
    old: '- **Yggdrasil v0.5.12 (Dec 2024)** — stable release, embedded Go library released.'
  - new: '## Primary sources


      - [Yggdrasil project status](https://yggdrasil-network.github.io/)'
    old: '## Primary sources'
  - old: A node's NodeID is `sha512(curve25519_public_key)`, truncated by an "address collapse" algorithm that gives collision resistance comparable to a true 128-bit hash by counting leading `1` bits.
    new: The current address implementation encodes a prefix, a count of leading bits and a truncated part of the bitwise-inverted Ed25519 public key. It is not the older SHA-512/Curve25519 construction.
  - old: Like Yggdrasil, every node has an Ed25519 keypair and the IPv6 address is derived from the public key.
    new: cjdns uses Curve25519 keys and derives an IPv6 address from the public key.
  - old: The address is constructed from `sha512(public_key)` truncated to 128 bits; the first 8 bits are set to `fc`.
    new: The address comes from a double SHA-512 hash of the public key, truncated to 128 bits. Key generation repeats until the result starts with `fc`; that prefix is not simply overwritten.
  - old: "### How naming works\n\n1. Each user has a long-term Ed25519 identity keypair.\n2. The \"name\" of a contact is whatever you've called them locally.\n3. To add a contact, you either:\n   - Scan a QR code (offline, in-person).\n   - Exchange a `briar://` URI over a secure channel.\n   - Meet over Bluetooth / Wi-Fi / Tor and discover peers.\n4. The contact's `briar://` URI encodes their public key, display name, and a \"known fingerprints\" hint.\n\nThe \"name\" is a string the user types in the contact list; the \"address\" is the public key, used for end-to-end encryption of direct messages and forum posts.\n\n### Transport fallback\n\nBriar uses the most aggressive transport fallback in the production privacy stack:\n\n- **Internet available**: connect via Tor.\n- **Internet available but Tor blocked**: connect via pluggable transports (Snowflake, meek, etc.).\n- **No internet**: connect over Bluetooth or Wi-Fi to nearby contacts.\n\nIn the Bluetooth / Wi-Fi mode, \"naming\" is\
      \ reduced to physical presence: you tap \"Add contact\", the phones discover each other over the local radio, exchange keys, and the contact is added. This is a kind of physical-layer out-of-band authentication, stronger than any DNS-based system.\n\n### Maturity (2026)\n\n- Briar 1.5.17 (March 2026) — current release.\n- Briar Desktop 0.6.0-beta — released 2026.\n- Active development; stable on Android, beta on desktop.\n- Used by activists, journalists, dissidents; not mainstream, not meant to be.\n"
    new: '### How naming works


      Contacts are added explicitly by scanning each other’s QR codes in person or exchanging contact links through another channel. Local Bluetooth or Wi-Fi reachability does not automatically authenticate strangers as contacts.


      ### Transport fallback


      Briar uses Tor over the internet and can synchronize with nearby contacts through Bluetooth or a local Wi-Fi network. Its manual documents the contact-addition and connection requirements; do not infer them from ordinary radio discovery.

      '
  - old: '- **Briar 1.5.17 (March 2026)**, **Briar Desktop 0.6.0-beta (2026)** — active development continues.

      '
    new: ''
  - old: A single Ed25519 keypair can be the master identity across all of these — a property that meshes well with [Pubky](/kb/pubky/)'s approach.
    new: These systems have different key formats and protocol requirements; sharing a master secret would require an explicit, domain-separated derivation design.
  updated: '2026-10-25'
