# The fifteen pillars of ungovernable.tech, in display order.
# key: URL segment (/pillars/<key>/), name: display name, short: nav label,
# question: the question a reader brings, intro: hub page intro (1-3 sentences).
- key: anonymity
  name: Anonymity Networks
  short: Anonymity
  question: How do I hide who is talking to whom?
  intro: Encryption hides what you say; anonymity networks hide that you said it. Onion routing, garlic routing and mix networks, from Tor's three hops to cover-traffic mixnets built to resist a global passive adversary.
- key: circumvention
  name: Censorship Circumvention
  short: Circumvention
  question: How do I reach the open internet when it is blocked?
  intro: Censors block IPs, poison DNS, fingerprint protocols and shut networks down entirely. These are the tools and techniques that keep people connected anyway, and the trade-offs each one makes.
- key: messaging
  name: Secure Messaging
  short: Messaging
  question: How do I talk privately, one to one and in groups?
  intro: End-to-end encryption is now table stakes. The real differences are identifiers, metadata, servers and who can be compelled to hand over what. Protocols, apps and how to choose between them.
- key: mesh
  name: Off-Grid and Mesh Networks
  short: Off-grid
  question: How do I communicate when the internet is down or cut?
  intro: LoRa meshes, Bluetooth meshes, packet radio, HF data modes and overlay networks that route around central infrastructure, or do without it.
- key: naming
  name: Sovereign Naming
  short: Naming
  question: How do I publish under a name nobody can seize?
  intro: "DNS is a chokepoint: registrars, registries and resolvers can all be ordered to take a name down. Self-authenticating names, blockchain registries and key-rooted alternatives, with an honest look at which ones are sovereign and which only look it."
- key: identity
  name: Identity, Social and Trust
  short: Identity
  question: How do I own my identity, my audience and my reputation?
  intro: Keys instead of accounts. Nostr, AT Protocol, DIDs, verifiable credentials, remote signers and webs of trust, plus the hard part, which is recovering when keys are lost.
- key: money
  name: Financial Sovereignty
  short: Money
  question: How do I hold and move value without permission?
  intro: Self-custody, your own node, payment privacy, ecash and peer-to-peer markets. Money that cannot be frozen, and the operational discipline it requires.
- key: storage
  name: Decentralized Storage
  short: Storage
  question: Where do I put data so it cannot be deleted for me?
  intro: Content-addressed and replicated storage networks, permanent archives and simple key-authenticated blob servers, and what each one actually guarantees.
- key: compute
  name: Decentralized Compute
  short: Compute
  question: Where do I run code without a landlord?
  intro: GPU marketplaces, compute-over-data, decentralized training and verifiable execution. What is real capacity, what is token theatre, and how trust is (or is not) handled.
- key: apps
  name: Sovereign Applications
  short: Apps
  question: How do I get and run software that no store can pull and no app can abuse?
  intro: Apps distributed without a gatekeeper, checked against their author's key, and confined to the access you grant. Nostr-published sites, applets and app stores, peer-to-peer runtimes, local-first data, reproducible builds and capability security.
- key: confidential
  name: Confidential Computing
  short: Confidential computing
  question: How do I compute on someone else's machine without trusting them?
  intro: Trusted execution environments such as Intel TDX, AMD SEV-SNP, Arm CCA and NVIDIA GPU TEEs, remote attestation, and the side channels that keep breaking them.
- key: cryptography
  name: Privacy-Enhancing Cryptography
  short: Cryptography
  question: How do I compute on, query or share data without revealing it?
  intro: Fully homomorphic encryption, multi-party computation, private information retrieval, private set intersection, threshold signatures and the primitives underneath them. Math instead of trust.
- key: zk
  name: Zero-Knowledge Proofs
  short: Zero-knowledge
  question: How do I prove something without revealing it?
  intro: SNARKs, STARKs, folding, polynomial commitments, and what they enable, from anonymous credentials and private payments to proofs about email and machine learning.
- key: pqc
  name: Post-Quantum Cryptography
  short: Post-quantum
  question: Will my encryption survive a quantum computer?
  intro: ML-KEM, ML-DSA, SLH-DSA, FN-DSA and HQC, hybrid migration, and what "harvest now, decrypt later" means for anything you encrypt today.
- key: endpoint
  name: Devices and Operational Security
  short: OpSec
  question: Is the device in my hand working for me or against me?
  intro: Every protocol on this site fails if the endpoint is compromised. Threat modeling, hardened phones, amnesic and compartmentalized operating systems, browsers, file encryption and the habits that hold it all together.
