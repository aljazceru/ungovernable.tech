pillar: apps
sections:
- title: Nostr-published apps and sites
  items:
  - name: napplet
    url: https://napplet.run/
    desc: 'Composable sandboxed Nostr applets (NIP-5D): a trusted shell brokers signing,
      relays and storage'
  - name: NIP-5D draft
    url: https://github.com/nostr-protocol/nips/pull/2303
    desc: Proposed spec for napplet sandboxing, identity and manifests
  - name: Kehto
    url: https://github.com/kehto/web
    desc: Early reference runtime and shell for hosting napplets
  - name: 'NIP-5A: nsites'
    url: https://github.com/nostr-protocol/nips/blob/master/5A.md
    desc: Static websites as signed Nostr manifests over Blossom blobs
  - name: nsyte
    url: https://github.com/sandwichfarm/nsyte
    desc: CLI to deploy, manage and inspect nsites
  - name: nsite-gateway
    url: https://github.com/hzrd149/nsite-gateway
    desc: Self-hostable gateway that serves nsites over HTTP
  - name: 'NIP-89: application handlers'
    url: https://github.com/nostr-protocol/nips/blob/master/89.md
    desc: Discover and recommend apps that handle a given Nostr event kind
- title: App distribution
  items:
  - name: Zapstore
    url: https://zapstore.dev/
    desc: Open Android app store with developer-signed releases on Nostr
  - name: F-Droid reproducible builds
    url: https://f-droid.org/docs/Reproducible_Builds/
    desc: How F-Droid verifies that APKs match their published source
  - name: Accrescent
    url: https://accrescent.app/
    desc: Security-focused Android store with signing-key pinning; alpha
  - name: Obtainium
    url: https://github.com/ImranR98/Obtainium
    desc: Install and update Android apps straight from their release pages
  - name: Pear
    url: https://docs.pears.com/
    desc: Holepunch's peer-to-peer runtime for shipping and updating apps over pear://
      links
- title: Local-first and peer-to-peer apps
  items:
  - name: Local-first software
    url: https://www.inkandswitch.com/essay/local-first/
    desc: Ink & Switch essay on apps that keep the primary copy on your device
  - name: Freenet
    url: https://freenet.org/
    desc: Peer-to-peer platform running applications as contracts on a small-world
      network
- title: Capability security and sandboxing
  items:
  - name: Spritely Goblins
    url: https://spritely.institute/goblins/
    desc: Distributed object-capability programming for Guile and Racket
  - name: OCapN
    url: https://ocapn.org/
    desc: 'Pre-standard object-capability network protocol: CapTP, handoffs, netlayers'
  - name: WebAssembly security model
    url: https://webassembly.org/docs/security/
    desc: How Wasm modules are sandboxed from their host
