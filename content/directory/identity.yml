  - name: World ID
    url: https://worldcoin.org/world-id
    desc: Privacy-preserving proof of personhood via iris biometrics with ZK proofs
  - name: EUDI Wallet
    url: https://european-digital-identity.eu/
    desc: European Digital Identity Wallet under eIDAS 2.0 regulation (2026)
