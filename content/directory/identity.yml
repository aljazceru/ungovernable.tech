- title: 'Identity: W3C Decentralized Identifiers (DIDs)'
  items:
  - name: W3C DID Core v1.0
    url: https://www.w3.org/TR/did-core/
    desc: Decentralized Identifiers specification — globally unique, self-owned identifiers
