    url: https://cardanofoundation.org/blog/veridian-digital-identity-platform
    desc: Open-source identity wallet using KERI and ACDC protocols
- title: 'Identity: Decentralized PKI'
  items:
  - name: DPKI Overview
    url: https://hackernoon.com/decentralized-public-key-infrastructure-dpki-what-is-it-and-why-does-it-matter-babee9d88579
    desc: 'Decentralized PKI: replacing Certificate Authorities with blockchain-based
