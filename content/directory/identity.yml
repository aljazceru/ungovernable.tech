    url: https://www.w3.org/news/2026/first-public-working-draft-verifiable-credentials-data-model-v2-1/
    desc: Latest working draft extending the VC standard (2026)
  - name: W3C VC Implementations
    url: https://github.com/w3c/verifiable-credentials/blob/main/implementations.md
    desc: Comprehensive list of VC implementations across languages
