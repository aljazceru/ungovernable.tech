- title: Related Privacy Infrastructure
  items:
  - name: Oblivious HTTP (OHTTP)
    url: https://en.wikipedia.org/wiki/Oblivious_HTTP
    desc: IETF protocol for anonymous HTTP transactions via relay
  - name: Oblivious DoH (ODoH)
    url: https://blog.cloudflare.com/oblivious-dns/
    desc: DNS resolution via oblivious relay to hide client identity from resolver
  - name: 'RFC 9458: OHTTP'
    url: https://www.rfc-editor.org/rfc/rfc9458
    desc: IETF standard for Oblivious HTTP
- title: Oblivious Requests
  items:
  - name: Oblivious HTTP
    url: https://www.rfc-editor.org/rfc/rfc9458.html
    desc: 'RFC 9458: separate the relay from the service decrypting HTTP requests'
  - name: Oblivious DNS over HTTPS
    url: https://www.rfc-editor.org/rfc/rfc9230.html
    desc: 'RFC 9230: separate the DNS proxy from the target resolver'
- title: Anonymous Sharing and Submissions
  items:
  - name: OnionShare
    url: https://docs.onionshare.org/2.6/en/features.html
    desc: Share or receive files, host static sites and run chat rooms through Tor
      onion services on your own computer
  - name: SecureDrop
    url: https://docs.securedrop.org/en/stable/what_is_securedrop.html
    desc: Freedom of the Press Foundation's newsroom submission system with onion
      services and an isolated document-viewing workflow
