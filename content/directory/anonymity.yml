pillar: anonymity
sections:
- title: Tor Network
  items:
  - name: Lyrebird
    url: https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird
    desc: Tor pluggable transport implementation supporting obfs4 and related bridge
      transports
  - name: Conjure
    url: https://github.com/refraction-networking/conjure
    desc: Refraction networking pluggable transport for censorship circumvention
  - name: Tor Project
    url: https://www.torproject.org/
    desc: Free software and decentralized network for anonymous communication
  - name: Tor Browser
    url: https://www.torproject.org/download/
    desc: Hardened Firefox browser configured for Tor
  - name: Onion Services
    url: https://community.torproject.org/onion-services/
    desc: Hidden services accessible only within the Tor network
  - name: Tor Pluggable Transports
    url: https://tb-manual.torproject.org/circumvention/
    desc: Censorship circumvention via obfs4, snowflake, and meek bridges
  - name: Snowflake
    url: https://snowflake.torproject.org/
    desc: WebRTC-based pluggable transport for Tor censorship resistance
  - name: Snowflake GitHub
    url: https://github.com/keroserene/snowflake
    desc: Original WebRTC pluggable transport repository with client, proxy, and library
      code
  - name: Snowflake 2.0
    url: https://ubos.tech/news/tors-2025-anti%E2%80%91censorship-strategies-lessons-from-iran-and-russia/
    desc: Major 2025 update with improved obfuscation and scalability for high-censorship
      regions
  - name: WebTunnel
    url: https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/webtunnel
    desc: HTTP-based obfuscation transport simulating regular HTTPS traffic
  - name: Conjure
    url: https://github.com/net4people/bbs/issues/124
    desc: New pre-alpha pluggable transport available in Tor Browser nightlies
  - name: Tor2web
    url: https://tor2web.org/
    desc: 'Access .onion services from a regular browser (trade-off: no anonymity)'
    status: caution
    note: Tor2web gives no anonymity to the reader; use Tor Browser instead.
  - name: Onion-Location
    url: https://community.torproject.org/onion-services/advanced/onion-location/
    desc: HTTP header for revealing .onion sites via regular browsers
  - name: Tor Network Documentation
    url: https://tb-manual.torproject.org/
    desc: Comprehensive manual for using Tor effectively
  - name: 'Tor Browser: Unblocking Tor'
    url: https://support.torproject.org/tor-browser/circumvention/unblocking-tor/
    desc: Official guide to obfs4, meek, Snowflake, WebTunnel, bridges, and Lyrebird
  - name: Tor daemon bridge setup
    url: https://support.torproject.org/little-t-tor/circumvention/using-bridges/
    desc: torrc examples for obfs4, Snowflake, and WebTunnel pluggable transports
