pillar: cryptography
sections:
- title: 'FHE: Research'
  items:
  - name: Full Homomorphic Encryption resources
    url: https://fhe.org/resources/
    desc: tons of FHE resources
  - name: Dark market implementation with FHE
    url: https://www.zama.ai/post/dark-market-tfhe-rs
    desc: ''
  - name: IBM Research FHE
    url: https://research.ibm.com/topics/fully-homomorphic-encryption
    desc: IBM's comprehensive resource on Fully Homomorphic Encryption, addressing
      the security gap when processing data. Their implementation provides security
      and privacy for data at rest, in transit, and during processing. IBM's work
      builds on Craig Gentry's groundbreaking 2009 research that introduced the first
      plausible fully homomorphic scheme.
  - name: Homomorphic Encryption at Scale
    url: https://www.fau.edu/engineering/senior-design/projects/spring2024/homomorphic-encryption-at-scale/
    desc: Florida Atlantic University's project exploring advancements in FHE, focusing
      on overcoming computational inefficiency challenges. Their research team has
      implemented bootstrapping techniques to reduce noise and incorporated parallel
      processing to enhance function optimization, particularly for linear regression
      models.
  - name: CRYPTML
    url: https://www.hes-so.ch/en/recherche-innovation/research-projects/detail-projet-recherche/cryptml-an-hybrid-machine-learning-model-using-homomorphic-encryption
    desc: A hybrid machine learning model using homomorphic encryption developed at
      HES-SO. This project explores a hybrid client-server architecture enabling machine
      learning computation on encrypted data, addressing the challenges of preserving
      privacy in AI applications.
- title: 'FHE: Libraries and Tools'
  items:
  - name: google/heir
    url: https://github.com/google/heir
    desc: A compiler for homomorphic encryption from Google, enabling automatic compilation
      of programs to work on encrypted data
  - name: OpenFHE
    url: https://paperswithcode.com/paper/openfhe-open-source-fully-homomorphic
    desc: A comprehensive open-source FHE software library incorporating design ideas
      from prior FHE projects like PALISADE, HElib, and HEAAN. OpenFHE includes features
      like automatic maintenance operations and hardware acceleration support through
      a standard Hardware Abstraction Layer (HAL).
  - name: OpenFHE v2.0
    url: https://dl.acm.org/doi/10.1145/3560827.3563379
    desc: Major December 2025 update with improved performance and new features (ACM
      TOPS 2025)
  - name: TFHE Library by Inpher
    url: https://inpher.io/tfhe-library/
    desc: One of the world's fastest open-source Fully Homomorphic Encryption libraries,
      maintained by Inpher's team with contributions from leading universities and
      privacy-first enterprises worldwide. The library implements the scheme described
      in the best paper from IACR's Asiacrypt 2016 conference.
  - name: TenSEAL
    url: https://sefiks.com/2023/04/10/a-step-by-step-fully-homomorphic-encryption-example-with-tenseal-in-python/
    desc: A practical FHE library for Python that allows performing both addition
      and multiplication on encrypted data. Unlike partially homomorphic encryption
      algorithms like RSA, ElGamal, or Paillier, TenSEAL offers fully homomorphic
      capabilities for real-world applications.
  - name: PostgreSQL Fully Homomorphic Encryption
    url: https://github.com/FHE-Postgres/pg_fhe
    desc: ''
  - name: The Transparent data encryption in PostgreSQL - Highgo Software Inc.
    url: https://www.highgo.ca/2019/09/30/the-transparent-data-encryption-in-postgresql/
    desc: ''
  - name: tfhe-rs
    url: https://github.com/zama-ai/tfhe-rs
    desc: 'TFHE-rs: A Pure Rust implementation of the TFHE Scheme for Boolean and
      Integer Arithmetics Over Encrypted Data.'
  - name: wgxli/simple-fhe
    url: https://github.com/wgxli/simple-fhe
    desc: A dead-simple library for full homomorphic encryption (FHE) in Python
  - name: hung-ngm/fhe-darkpool
    url: https://github.com/hung-ngm/fhe-darkpool
    desc: Test implementation of dark pool using Full Homomorphic Encryption (FHE)
  - name: FeanorTheElf/fheanor
    url: https://github.com/FeanorTheElf/fheanor
    desc: A modular library for designing and optimising homomorphic encryption schemes
  - name: cipherflow-fhe/latti-ai
    url: https://github.com/cipherflow-fhe/latti-ai
    desc: Framework for performing AI model inference on encrypted data using FHE
  - name: danieleschmidt/homomorphic-llm-proxy
    url: https://github.com/danieleschmidt/homomorphic-llm-proxy
    desc: GPU-accelerated gateway for FHE of LLM inference — process prompts on untrusted
      cloud infrastructure while maintaining complete privacy
  - name: Lattigo
    url: https://github.com/tuneinsight/lattigo
    desc: Open-source lattice-based homomorphic encryption library in Go, maintained
      by Tune Insight (originally EPFL)
  - name: OpenFHE
    url: https://github.com/openfheorg/openfhe-development
    desc: Comprehensive open-source FHE library supporting all major schemes (BGV,
      BFV, CKKS, FHEW, TFHE) with hardware acceleration HAL
  - name: Fhenix Confidential Contracts
    url: https://github.com/FhenixProtocol/fhenix-confidential-contracts
    desc: Solidity smart contracts for confidential ERC-20 tokens using FHE on the
      Fhenix L2 network
- title: 'FHE: FHE Ecosystem Updates'
  items:
  - name: 'Zama at FHE.org 2026: Eight Contributions from Taipei'
    url: https://www.zama.org/post/zama-at-fhe-org-2026-eight-contributions-from-taipei
    desc: New sorting-based techniques for faster TFHE deployments
  - name: FHE.org 2026 Taipei
    url: https://fhe.org/conferences/conference-2025/program.html
    desc: 5th Annual FHE conference colocated with Real World Crypto 2026
  - name: Zama FHE Technology Enables Private Computation
    url: https://www.ainvest.com/news/zama-fhe-technology-enables-private-computation-institutional-adoption-2026-2604/
    desc: Institutional adoption in 2026, confidential smart contracts in Solidity
  - name: Mind Network FHE A2A
    url: https://cn.tradingview.com/news/panews:4ada7974fe3f9:0/
    desc: First FHE-based A2A privacy solution with x402 protocol
  - name: Inco Network
    url: https://blockeden.xyz/blog/2026/01/05/zama-protocol/
    desc: Confidentiality-as-a-service using Zama's fhEVM for existing chains
  - name: OpenZeppelin Zama Networks
    url: https://www.openzeppelin.com/networks/zama
    desc: OpenZeppelin audited smart contracts for Zama FHEVM
  - name: Zama T-REX Ledger Integration
    url: https://cryptorank.io/news/feed/521c5-zama-rwa-privacy-trex-ledger
    desc: FHE-powered RWA tokenization for institutional finance
  - name: Zama $57M Series B
    url: https://x.com/cxmrondlls/status/1978506404400136611
    desc: Zama raised $57M B轮融资,估值超过$1B for FHE区块链应用
  - name: Zama Confidential Blockchain Protocol
    url: https://www.zama.org/post/announcing-the-zama-confidential-blockchain-protocol
    desc: Mainnet launch December 2025 for confidential smart contracts on any L1/L2
  - name: Zama Confidential USDT Transfers
    url: https://www.kucoin.com/news/articles/fhe-in-2026-computing-on-encrypted-data-and-the-projects-making-private-blockchains-a-reality
    desc: First confidential USDT transfers on mainnet
  - name: ZAMA Token Launch
    url: https://phemex.com/academy/what-is-zama
    desc: ZAMA token launched February 2026 for protocol fees, staking, and operator
      incentives
- title: 'MPC: MPC Overviews'
  items:
  - name: A Pragmatic Introduction to Secure Multi-Party Computation
    url: https://securecomputation.org/
    desc: Free book introducing secure computation protocols and applications
  - name: awesome-mpc
    url: https://github.com/rdragos/awesome-mpc
    desc: Curated list of MPC software, papers, tutorials, and workshops
  - name: MPC Deployments
    url: https://mpc.cs.berkeley.edu/
    desc: UC Berkeley hub for real-world secure multi-party computation deployments
- title: 'MPC: MPC Frameworks'
  items:
  - name: MP-SPDZ
    url: https://github.com/data61/MP-SPDZ
    desc: Versatile framework for benchmarking MPC protocols across honest/dishonest
      majority and active/passive security models
  - name: EMP Toolkit
    url: https://github.com/emp-toolkit/emp-agmpc
    desc: Global-scale secure multi-party computation toolkit in C++
  - name: CrypTen
    url: https://crypten.ai/
    desc: PyTorch-based research framework for secure and privacy-preserving machine
      learning with MPC
  - name: SCALE-MAMBA
    url: https://github.com/KULeuven-COSIC/SCALE-MAMBA
    desc: MPC system supporting SPDZ-family protocols and malicious-security settings
  - name: FRESCO
    url: https://github.com/aicis/fresco
    desc: Java framework for efficient secure computation applications and protocol
      suites
  - name: ABY
    url: https://github.com/encryptogroup/ABY
    desc: Mixed-protocol secure two-party computation framework combining arithmetic
      sharing, Boolean sharing, and Yao circuits
  - name: MOTION
    url: https://github.com/encryptogroup/MOTION
    desc: C++ framework for mixed-protocol MPC with GMW, BMR, arithmetic sharing,
      and OT-based protocols
- title: 'MPC: MPC Applications'
  items:
  - name: TLSNotary
    url: https://tlsnotary.org/
    desc: MPC-based protocol for proving facts about HTTPS sessions without revealing
      private data
  - name: PSE MPC Framework
    url: https://github.com/privacy-scaling-explorations/mpc-framework
    desc: TypeScript framework and demos for MPC-powered applications (sunset but
      useful reference)
  - name: Trinity
    url: https://github.com/privacy-scaling-explorations/Trinity
    desc: Two-party computation design combining laconic OT, garbled circuits, and
      PLONK
- title: 'PIR: Implementations'
  items:
  - name: FastPIR
    url: https://github.com/ishtiyaque/FastPIR
    desc: An efficient computational private information retrieval (CPIR) library  in
      C++
  - name: SimplePIR
    url: https://github.com/ahenzinger/simplepir
    desc: 'One Server for the Price of Two: Simple and Fast Single-Server Private
      Information Retrieval'
  - name: private-search
    url: https://github.com/exo-explore/private-search/
    desc: Private Web Search for Local LLMs
  - name: secretflow/psi
    url: https://github.com/secretflow/psi
    desc: Private Set Intersection (PSI) and Private Information Retrieval (PIR) from
      SecretFlow
  - name: vt-asaplab/pirex
    url: https://github.com/vt-asaplab/pirex
    desc: Client-Efficient Private Information Retrieval (PETS 2025)
  - name: ahenzinger/finite-diffs-pir
    url: https://github.com/ahenzinger/finite-diffs-pir
    desc: 'Reference PIR implementation: two-server PIR in sublinear time and quasilinear
      space (EUROCRYPT 2026)'
  - name: google/private-retrieval
    url: https://github.com/google/private-retrieval
    desc: Google C++ PIR library using SHELL homomorphic encryption components
  - name: OpenMined/PIR
    url: https://github.com/OpenMined/PIR
    desc: OpenMined private information retrieval protocol implementations across
      shared project requirements
  - name: microsoft/SealPIR
    url: https://github.com/microsoft/SealPIR
    desc: Research implementation of SealPIR with low communication costs using Microsoft
      SEAL
  - name: XPIR
    url: https://github.com/XPIR-team/XPIR
    desc: Ring-LWE computational PIR library from the POPETS 2016 XPIR paper
  - name: Onion-PIR
    url: https://github.com/mhmughees/Onion-PIR
    desc: Lattice-based single-server PIR composing two SHE schemes for smaller replies
  - name: PIR-PIXR/CPIR
    url: https://github.com/PIR-PIXR/CPIR
    desc: Reference code for committed private information retrieval
  - name: ChalametPIR
    url: https://github.com/itzmeanjan/ChalametPIR
    desc: Stateful single-server keyword PIR scheme built on top of FrodoPIR
- title: 'PIR: Academic Papers and Surveys'
  items:
  - name: 'IM-PIR: In-Memory Private Information Retrieval'
    url: https://arxiv.org/abs/2509.06514
    desc: PIM-based multi-server PIR with 3.7x query throughput improvement
  - name: Communication-Efficient Single-Server PIR
    url: https://eprint.iacr.org/2025/2074
    desc: VIA scheme eliminating offline communication with Oλ(log N) online cost
  - name: Efficient Batch Symmetric Private Information Retrieval from PSI
    url: https://eprint.iacr.org/2025/1201
    desc: SPIR variant with database privacy beyond retrieved entry
  - name: 'Spiral: Fast, High-Rate Single-Server PIR via FHE Composition'
    url: https://eprint.iacr.org/2022/368
    desc: ''
  - name: 'Private Information Retrieval and Its Applications: An Introduction'
    url: https://arxiv.org/abs/2304.14397
    desc: A 2023 paper introducing PIR fundamentals, variants, and discussing conceptual
      extensions and potential research directions
  - name: 'A Survey of Single-Database PIR: Techniques and Applications'
    url: https://iacr.org/archive/pkc2007/44500393/44500393.pdf
    desc: This paper surveys Single-Database PIR techniques, exploring connections
      to other cryptographic primitives like collision-resistant hash functions and
      oblivious transfer
  - name: A Survey on Private Information Retrieval
    url: https://crypto.stanford.edu/~dabo/courses/cs355_fall07/pir.pdf
    desc: A comprehensive survey by William Gasarch exploring different PIR models
      including multiple non-communicating databases and computationally bounded single
      databases
  - name: A survey on single server PIR in a coding theory perspective
    url: https://www.zora.uzh.ch/id/eprint/221280/1/ZORA_s00200_021_00508_5.pdf
    desc: Presents a new perspective on single server PIR schemes using linear error-correcting
      codes
  - name: On the Computational Practicality of Private Information Retrieval
    url: https://www.ndss-symposium.org/wp-content/uploads/2017/09/On-the-Practicality-of-Private-Information-Retrieval-Radu-Sion.pdf
    desc: Explores the practical limits of single-server computational PIR for preserving
      client access patterns
  - name: Committed Private Information Retrieval
    url: https://arxiv.org/abs/2302.01733
    desc: A 2023 paper proposing a generic construction combining linear map commitment
      and linear PIR schemes to produce verifiable PIR
  - name: Private Information Retrieval with Access Control
    url: https://dspace.mit.edu/handle/1721.1/151392
    desc: Presents Pirac, a novel framework for access control in PIR that restricts
      database record access to authorized users while maintaining privacy
  - name: 'Piano: Extremely Simple, Single-Server PIR'
    url: https://www.cs.cmu.edu/~csd-phd-blog/2024/piano-private-information-retrieval/
    desc: A 2024 article describing a simple approach to single-server Private Information
      Retrieval
  - name: Private Information Retrieval in Large Scale Data Repositories
    url: https://ishtiyaque.github.io/files/VLDB_2023_Tutorial.pdf
    desc: A tutorial addressing how clients can privately retrieve values corresponding
      to given keys or locations in large public data repositories
  - name: Private Web Search with Tiptoe
    url: https://people.csail.mit.edu/nickolai/papers/henzinger-tiptoe.pdf
    desc: Privacy-preserving web search using PIR techniques
  - name: 'GPIR: Enabling Practical PIR with GPUs'
    url: https://arxiv.org/html/2604.04696v1
    desc: GPU-accelerated private information retrieval achieving practical performance
      (2026)
  - name: 'Mk-PIR: Multi-Keyword Private Information Retrieval'
    url: https://eprint.iacr.org/2025/1695
    desc: Enables private conjunctive queries with multiple keywords (IACR 2025)
  - name: Incremental Single-Server PIR
    url: https://eprint.iacr.org/2026/030
    desc: Extends incremental preprocessing to single-server PIR for efficient updates
      (2026)
  - name: 'NewtonPIR: Communication Efficient Single-Server PIR'
    url: https://dl.acm.org/doi/abs/10.1007/978-981-95-7072-0_30
    desc: PETS 2025 paper on efficient single-server PIR
- title: Access-pattern Privacy
  items:
  - name: Path ORAM
    url: https://eprint.iacr.org/2013/280
    desc: Stefanov and colleagues' oblivious read/write storage construction
