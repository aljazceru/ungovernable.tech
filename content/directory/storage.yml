pillar: storage
sections:
- title: Storage and retention
  items:
  - name: IPFS persistence and pinning
    url: https://docs.ipfs.tech/concepts/persistence/
    desc: How pins protect data from garbage collection and how retention differs
      from content addressing
  - name: Filecoin documentation
    url: https://docs.filecoin.io/basics/what-is-filecoin/overview
    desc: Storage providers, economic incentives and cryptographic storage proofs
  - name: Arweave
    url: https://www.arweave.org/
    desc: Project overview of its permanent information storage network
  - name: Tahoe-LAFS source
    url: https://github.com/tahoe-lafs/tahoe-lafs
    desc: Canonical repository for the encrypted distributed storage system
  - name: Tahoe-LAFS documentation
    url: https://tahoe-lafs.readthedocs.io/
    desc: Client and server setup, architecture and grid administration
- title: Sync and collaborative data
  items:
  - name: Syncthing
    url: https://syncthing.net/
    desc: Folder synchronization between approved devices
  - name: Automerge
    url: https://automerge.org/
    desc: Local-first synchronization with concurrent merging and document history
  - name: Yjs documentation
    url: https://docs.yjs.dev/
    desc: Shared CRDT types, editor integrations and network providers
  - name: CryptPad
    url: https://cryptpad.org/
    desc: Collaborative documents with client-side encryption
  - name: Local-first software
    url: https://www.inkandswitch.com/essay/local-first/
    desc: Ink & Switch essay on local copies, offline work, collaboration and user
      control
- title: Offline libraries
  items:
  - name: Kiwix Reader
    url: https://get.kiwix.org/applications/kiwix-reader/
    desc: Read Wikipedia and other ZIM archives without an internet connection
  - name: Kiwix Server
    url: https://get.kiwix.org/applications/kiwix-server/
    desc: Serve ZIM archives to browsers on a local network with kiwix-serve
- title: Replication libraries and blob servers
  items:
  - name: Hypercore
    url: https://github.com/holepunchto/hypercore
    desc: Signed Merkle-tree logs with sparse replication and a truncation API
  - name: Hyperdrive
    url: https://github.com/holepunchto/hyperdrive
    desc: Distributed filesystem APIs with version checkouts and explicit file downloads
  - name: Hyperswarm
    url: https://github.com/holepunchto/hyperswarm
    desc: Topic-based peer discovery through a DHT and encrypted peer connections
  - name: Blossom specifications
    url: https://github.com/hzrd149/blossom
    desc: HTTP blob-server protocol using SHA-256 addresses and Nostr identities
- title: BitTorrent specifications
  items:
  - name: 'BEP 3: BitTorrent protocol'
    url: https://www.bittorrent.org/beps/bep_0003.html
    desc: Torrent metadata, piece hashes, trackers and peer transfers
  - name: 'BEP 5: DHT'
    url: https://www.bittorrent.org/beps/bep_0005.html
    desc: Distributed peer contact discovery for trackerless torrents
  - name: 'BEP 9: Metadata exchange'
    url: https://www.bittorrent.org/beps/bep_0009.html
    desc: Fetching torrent metadata from peers and magnet link formats
  - name: 'BEP 19: Web seeds'
    url: https://www.bittorrent.org/beps/bep_0019.html
    desc: HTTP and FTP sources for torrent data
  - name: 'BEP 52: BitTorrent v2'
    url: https://www.bittorrent.org/beps/bep_0052.html
    desc: SHA-256-based torrent metadata and per-file Merkle trees
- title: Mutable names
  items:
  - name: IPNS documentation
    url: https://docs.ipfs.tech/concepts/ipns/
    desc: Signed mutable names, DHT and PubSub publication, validity and caching
  - name: DNSLink specification
    url: https://dnslink.dev/
    desc: DNS TXT records that associate domains with content paths
- title: Transfer and archive services
  items:
  - name: Magic Wormhole documentation
    url: https://magic-wormhole.readthedocs.io/en/latest/
    desc: Transfer-tool documentation, CLI usage and protocol specifications
  - name: Internet Archive BitTorrent help
    url: https://help.archive.org/help/archive-bittorrents/
    desc: Archive torrent downloads, web seeds and problems caused by changed items
