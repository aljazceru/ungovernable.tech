pillar: endpoint
sections:
- title: Browser Hardening
  items:
  - name: Arkenfox user.js
    url: https://github.com/arkenfox/user.js
    desc: Firefox privacy, security, anti-tracking, and fingerprint-resistance configuration
      template
  - name: Tor Browser
    url: https://www.torproject.org/download/
    desc: Hardened Firefox browser routed through Tor for strong anonymity sets
  - name: LibreWolf
    url: https://librewolf.net/
    desc: Firefox fork with privacy defaults, telemetry removal, and fingerprinting
      protections
  - name: Mullvad Browser
    url: https://github.com/mullvad/mullvad-browser
    desc: Tor Project and Mullvad privacy browser designed to reduce fingerprinting
      without Tor routing
  - name: uBlock Origin
    url: https://github.com/gorhill/uBlock
    desc: Efficient wide-spectrum blocker for ads, trackers, malware, and coin miners
  - name: ClearURLs
    url: https://github.com/ClearURLs/Addon
    desc: Browser extension that removes tracking parameters from URLs
  - name: Privacy Possum
    url: https://github.com/cowlicks/privacypossum
    desc: Browser extension that reduces and falsifies data collected by commercial
      trackers
  - name: Privacy Guides
    url: https://github.com/privacyguides/privacyguides.org
    desc: Community-maintained recommendations for defending against mass surveillance
- title: Mobile & Device Hardening
  items:
  - name: GrapheneOS
    url: https://github.com/GrapheneOS/platform_manifest
    desc: Android privacy and security hardening project for supported Pixel devices
  - name: Orbot
    url: https://github.com/guardianproject/orbot
    desc: Tor VPN/proxy app for Android by Guardian Project
  - name: Rethink DNS + Firewall
    url: https://github.com/celzero/rethink-app
    desc: Android encrypted DNS, WireGuard proxifier, app firewall, and connection
      tracker
  - name: TrackerControl
    url: https://github.com/TrackerControl/tracker-control-android
    desc: Android app for monitoring and blocking hidden tracker connections across
      installed apps
  - name: Exodus Privacy
    url: https://github.com/Exodus-Privacy/exodus
    desc: Platform for auditing trackers and privacy risks in Android applications
- title: DNS & Network Blocking
  items:
  - name: HaGeZi DNS Blocklists
    url: https://github.com/hagezi/dns-blocklists
    desc: Maintained DNS blocklists for ads, telemetry, phishing, malware, and tracking
      domains
- title: Private Search
  items:
  - name: Whoogle Search
    url: https://github.com/benbusby/whoogle-search
    desc: Self-hosted, ad-free Google metasearch proxy; final release in 2026 due
      to Google blocking
- title: Fingerprinting Tests
  items:
  - name: CreepJS
    url: https://github.com/abrahamjuliot/creepjs
    desc: Browser fingerprinting test suite for auditing how trackable a browser/device
      is
  - name: web-fingerprinting
    url: https://github.com/abrahamjuliot/web-fingerprinting
    desc: Research collection covering fingerprinting papers, attacks, mitigations,
      and test suites
  - name: Browser Fingerprinting Resistance Research
    url: https://github.com/Joe12387/browser-fingerprinting-resistance-research
    desc: Matrix comparing browser protections against common fingerprinting techniques
- title: Passkeys and Security Keys
  items:
  - name: WebAuthn Level 3
    url: https://www.w3.org/TR/webauthn-3/
    desc: 'W3C public-key authentication specification: credentials, origin checks
      and backup state'
  - name: FIDO passkeys
    url: https://fidoalliance.org/passkeys/
    desc: Definitions and guidance for synced and device-bound passkeys
  - name: FIDO authentication specifications
    url: https://fidoalliance.org/specifications/download/
    desc: Official WebAuthn and CTAP specification references
- title: Document Safety
  items:
  - name: Dangerzone
    url: https://dangerzone.rocks/
    desc: FPF tool that renders untrusted documents in isolation and rebuilds PDFs
      from pixels
  - name: mat2
    url: https://github.com/jvoisin/mat2
    desc: Metadata cleanup for supported documents, images and other file formats
  - name: ExifTool
    url: https://exiftool.org/
    desc: Read and edit file metadata; PDF edits are reversible and need further sanitization
- title: Incident Response
  items:
  - name: Mobile Verification Toolkit
    url: https://github.com/mvt-project/mvt
    desc: Android and iOS forensic tooling for investigators; a negative result cannot
      prove a device is clean
  - name: Access Now Digital Security Helpline
    url: https://www.accessnow.org/help/
    desc: Free digital-security assistance and incident response for civil society
- title: Router and Boot Firmware
  items:
  - name: OpenWrt
    url: https://openwrt.org/
    desc: Linux router firmware with package management for supported hardware
  - name: Heads
    url: https://osresearch.net/
    desc: Boot firmware with integrity checks; TPM and token protections depend on
      board configuration
  - name: fwupd
    url: https://github.com/fwupd/fwupd
    desc: Firmware-update service for supported devices
  - name: Linux Vendor Firmware Service
    url: https://fwupd.org/
    desc: Vendor firmware distribution and metadata used by fwupd clients
- title: Self-Hosting Servers
  items:
  - name: StartOS documentation
    url: https://docs.start9.com/start-os/0.4.0.x/
    desc: Personal-server service installation, networking, backups and system administration
  - name: YunoHost
    url: https://yunohost.org/
    desc: Debian-based server administration with packaged applications, users and
      backups
