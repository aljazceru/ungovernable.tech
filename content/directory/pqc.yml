pillar: pqc
sections:
- title: NIST Post-Quantum Standards
  items:
  - name: 'FIPS 203: ML-KEM'
    url: https://csrc.nist.gov/pubs/fips/203/final
    desc: Module-Lattice-Based Key-Encapsulation Mechanism (formerly CRYSTALS-Kyber)
  - name: 'FIPS 204: ML-DSA'
    url: https://csrc.nist.gov/pubs/fips/204/final
    desc: Module-Lattice-Based Digital Signature Algorithm (formerly CRYSTALS-Dilithium)
  - name: 'FIPS 205: SLH-DSA'
    url: https://csrc.nist.gov/pubs/fips/205/final
    desc: Stateless Hash-Based Digital Signature Algorithm (formerly SPHINCS+)
  - name: NIST PQC Standardization
    url: https://csrc.nist.gov/projects/post-quantum-cryptography
    desc: Official NIST post-quantum cryptography project page
- title: Open Source Implementations
  items:
  - name: Cloudflare CIRCL
    url: https://github.com/cloudflare/circl
    desc: Go cryptographic library with post-quantum primitives including ML-KEM and
      ML-DSA
  - name: oqs-provider
    url: https://github.com/open-quantum-safe/oqs-provider
    desc: OpenSSL 3 provider enabling liboqs quantum-safe and hybrid algorithms for
      TLS 1.3
  - name: liboqs
    url: https://github.com/open-quantum-safe/liboqs
    desc: C library for quantum-safe cryptographic algorithms (Open Quantum Safe project)
  - name: PQClean
    url: https://github.com/pqclean/PQClean
    desc: Clean, portable, reference implementations of post-quantum schemes
  - name: PQ Code Package
    url: https://github.com/pq-code-package
    desc: Maintained successor to PQClean for NIST-standardized PQC schemes
  - name: Open Quantum Safe
    url: https://openquantumsafe.org/
    desc: Project integrating PQC into TLS, SSH, and other protocols via liboqs
  - name: pqcrystals/kyber
    url: https://github.com/pq-crystals/kyber
    desc: Reference implementation of ML-KEM (Kyber)
  - name: pqcrystals/dilithium
    url: https://github.com/pq-crystals/dilithium
    desc: Reference implementation of ML-DSA (Dilithium)
  - name: OpenSSL 3.5 PQC
    url: https://cfp.openssl-conference.org/openssl-conference-2025/talk/8X8YTF/
    desc: Post-quantum TLS 1.3 integration in OpenSSL (Kyber, Dilithium)
  - name: OQS-OpenSSH
    url: https://github.com/open-quantum-safe/openssh
    desc: Prototype OpenSSH fork with liboqs-based quantum-resistant key exchange
      and authentication
  - name: OQS Demos
    url: https://github.com/open-quantum-safe/oqs-demos
    desc: Integration recipes and demos for using liboqs in TLS, SSH, curl, and related
      software
  - name: itzmeanjan/ml-kem
    url: https://github.com/itzmeanjan/ml-kem
    desc: C++20 implementation of NIST FIPS 203 ML-KEM
- title: Hybrid Key Exchange
  items:
  - name: IETF X25519MLKEM768 TLS Draft
    url: https://www.ietf.org/archive/id/draft-kwiatkowski-tls-ecdhe-mlkem-02.html
    desc: Hybrid ECDHE plus ML-KEM key agreement for TLS 1.3
  - name: X25519Kyber768 in TLS
    url: https://www.ietf.org/archive/id/draft-tls-westerbaan-xyber768d00-02.html
    desc: Hybrid post-quantum key exchange for TLS 1.3 (deployed in Chrome)
  - name: Chrome PQC Deployment
    url: https://chromestatus.com/feature/5257822742249472
    desc: Chrome's X25519Kyber768 key encapsulation for TLS
  - name: 'RFC 9180: HPKE'
    url: https://www.rfc-editor.org/rfc/rfc9180
    desc: Hybrid Public Key Encryption (extensible to PQC KEMs)
- title: Migration & Compliance
  items:
  - name: Meta PQC Migration Framework
    url: https://engineering.fb.com/2026/04/16/security/post-quantum-cryptography-migration-at-meta-framework-lessons-and-takeaways/
    desc: Practical migration levels, inventory, deployment guardrails, and organizational
      lessons
  - name: NSA CNSA 2.0
    url: https://www.nsa.gov/Press-Room/Cybersecurity-Advisories-Guidance/
    desc: CNSA 2.0 Suite requirements for national security systems (ML-KEM-1024,
      ML-DSA-87)
  - name: PQCC International Requirements
    url: https://pqcc.org/international-pqc-requirements/
    desc: Global PQC migration requirements and timelines
  - name: NIST SP 800-227
    url: https://csrc.nist.gov/pubs/sp/800/227/ipd
    desc: Recommendations for key-encapsulation mechanisms
  - name: TNO PQChoiceAssistant
    url: https://github.com/TNO/PQChoiceAssistant
    desc: Tool for choosing suitable post-quantum algorithms for a deployment use
      case
- title: Research & Analysis
  items:
  - name: Inside NIST's PQC
    url: https://postquantum.com/post-quantum/nists-pqc-technical/
    desc: Technical deep-dive into Kyber, Dilithium, and SPHINCS+
  - name: Meta-analysis of PQC Finalists
    url: https://emerginginvestors.org/articles/23-233/pdf
    desc: Performance and security comparison of NIST-endorsed algorithms
  - name: Palo Alto PQC Guide
    url: https://www.paloaltonetworks.com/cyberpedia/pqc-standards
    desc: Enterprise guide to PQC standards and migration strategy
- title: Migration planning
  items:
  - name: CISA, NSA and NIST quantum-readiness guidance
    url: https://www.cisa.gov/resources-tools/resources/quantum-readiness-migration-post-quantum-cryptography
    desc: Roadmaps, cryptographic inventories and supplier coordination
