pillar: naming
sections:
- title: Nostr & Public-Key DNS
  items:
  - name: nomen
    url: https://github.com/ursuscamp/nomen
    desc: Nostr and Bitcoin based naming system
  - name: pkdns
    url: https://github.com/pubky/pkdns
    desc: pkarr based DNS setup compatible with existing DNS
  - name: pkarr
    url: https://github.com/pubky/pkarr
    desc: Public Key Addressable Resource Records
  - name: Nuhvi/pkarr
    url: https://github.com/Nuhvi/pkarr
    desc: Public-Key Addressable Resource Records using Mainline DHT and BEP44 for
      sovereign TLDs
  - name: pkdns-publisher
    url: https://github.com/pubky/pkdns-publisher
    desc: Rust service that republishes PKARR DNS records to keep them alive on Mainline
      DHT
  - name: Pkarr Introduction
    url: https://github.com/pubky/pkarr/blob/main/docs/introduction.md
    desc: Technical overview of public-key addressable DNS records over Mainline DHT
  - name: Pubky Core
    url: https://github.com/pubky/pubky-core
    desc: Homeserver and SDK stack for public-key-based censorship-resistant web applications
  - name: Pubky Nexus
    url: https://github.com/pubky/pubky-nexus
    desc: Backend indexing layer connecting Pubky homeservers to social-app APIs
  - name: Pubky App
    url: https://github.com/pubky/pubky-app
    desc: Web client for the Pubky social application ecosystem
- title: ENS
  items:
  - name: Ethereum Name Service
    url: https://ens.domains/
    desc: Ethereum-based decentralized naming system
  - name: ENS Documentation
    url: https://docs.ens.domains/
    desc: Official protocol, resolution, registrar, resolver, and developer docs
  - name: ENSIP-1
    url: https://docs.ens.domains/ensip/1
    desc: Core ENS protocol specification for registry, resolvers, namehash, and registrars
  - name: ENS Contracts
    url: https://github.com/ensdomains/ens-contracts
    desc: Core smart contracts for ENS registry, registrars, and public resolvers
- title: Cardano DNS
  items:
  - name: blinklabs-io/dns-contracts
    url: https://github.com/blinklabs-io/dns-contracts
    desc: Decentralized DNS service and marketplace contracts on Cardano
- title: Handshake
  items:
  - name: Handshake
    url: https://handshake.org/
    desc: Decentralized, permissionless naming protocol replacing Certificate Authorities
  - name: Handshake GitHub
    url: https://github.com/handshake-org/hsd
    desc: Node implementation and protocol specs
  - name: hnsd
    url: https://github.com/handshake-org/hnsd
    desc: Lightweight SPV resolver daemon for resolving Handshake names locally
  - name: Awesome Handshake
    url: https://github.com/namebasehq/awesome-handshake
    desc: Curated directory of Handshake sites, resolvers, nameservers, and tutorials
  - name: Namebase Learning Center
    url: https://learn.namebase.io/about-handshake/about-handshake
    desc: Introductory Handshake docs covering decentralized root-zone ownership
  - name: Handshake Decentralized SLDs
    url: https://github.com/namebasehq/decentralized-slds
    desc: Proposal for ERC-721 second-level domains anchored to Handshake TLDs
  - name: Handshake Tools
    url: https://github.com/htools-org
    desc: DANE, site-check, login, and protocol tooling for the Handshake ecosystem
  - name: Resolving Handshake Domains
    url: https://handypedia.org/resolve
    desc: Handypedia guide comparing hsd, hnsd, Fingertip, Beacon, and remote resolvers
  - name: Bob Wallet
    url: https://bobwallet.io/
    desc: GUI wallet for Handshake name management
  - name: Handshake DNS Replacement Guide
    url: https://decentralizers.com/2025/12/02/handshake-dns-replacement-guide/
    desc: 10-step guide to replacing DNS with Handshake (December 2025)
  - name: Alternative DNS Systems - ENS, Handshake
    url: https://rx-name.net/blog/alternative-dns-systems-ens-handshake-and-other-non-icann-solutions
    desc: Comparison of decentralized DNS alternatives
  - name: A Practical Guide to Decentralized Websites
    url: https://ens.domains/blog/post/decentralized-websites
    desc: Deploying decentralized websites using ENS, IPFS, Filecoin, and Safe
  - name: Tokenized DNS Domains with Doma and ENS
    url: https://ens.domains/blog/post/d3-doma
    desc: Doma Protocol enabling DNS domains to function as ENS names
- title: Namecoin
  items:
  - name: Namecoin
    url: https://www.namecoin.org/
    desc: Experimental decentralized DNS and identity using Bitcoin infrastructure
  - name: Namecoin Post-Quantum TLS
    url: https://www.namecoin.org/2025/09/23/is-post-quantum-namecoin-tls-feasible.html
    desc: Research on PQ-resistant Namecoin TLS implementation
  - name: Namecoin FOSDEM 2026
    url: https://www.namecoin.org/2026/01/26/fosdem-2026.html
    desc: Namecoin and Tor PKI presentation announcement for FOSDEM 2026
- title: Mesh network naming
  items:
  - name: zhoreeq/meshname
    url: https://github.com/zhoreeq/meshname
    desc: Universal naming system for all IPv6-based mesh networks (CJDNS, Yggdrasil)
