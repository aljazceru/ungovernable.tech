pillar: money
sections:
- title: Atomic Swaps
  items:
  - name: TierNolan's atomic swap
    url: https://bitcointalk.org/index.php?topic=193281.msg2224948
    desc: Original atomic cross-chain swap proposal (2013)
  - name: Bitcoin–Monero Atomic Swap Protocol
    url: https://github.com/h4sh3d/xmr-btc-atomic-swap
    desc: Research protocol for BTC-XMR swaps using adaptor signatures and discrete-log
      proofs
  - name: Monero Atomic Swaps Announcement
    url: https://www.getmonero.org/2021/08/20/atomic-swaps.html
    desc: Monero project announcement of BTC-XMR atomic swap software reaching mainnet
      usability
  - name: Bitcoin Script for HTLCs
    url: https://en.bitcoin.it/wiki/Hash_Time_Locked_Contracts
    desc: Hash Time-Locked Contracts for atomic swaps
  - name: Komodo BarterDEX
    url: https://github.com/KomodoPlatform/komodo-defi-framework
    desc: Decentralized exchange supporting atomic swaps across 95+ chains
  - name: Liquality
    url: https://liquality.io/
    desc: Atomic swap wallet for BTC/ETH/ERC-20
    status: defunct
    note: Liquality wallet was discontinued.
- title: 'Atomic Swaps: Adaptor Signatures (Scriptless Swaps)'
  items:
  - name: Scriptless Scripts
    url: https://lists.linuxfoundation.org/pipermail/bitcoin-dev/2017-August/014998.html
    desc: Andrew Poelstra's adaptor signature concept for privacy-preserving swaps
  - name: MuSig2 adaptor signatures
    url: https://eprint.iacr.org/2022/807.pdf
    desc: Two-round adaptor signatures for Schnorr
  - name: secp256kfun adaptor
    url: https://github.com/LLFourn/secp256kfun
    desc: Rust library for adaptor signatures
- title: 'Atomic Swaps: Cross-Chain Infrastructure'
  items:
  - name: COMIT Network
    url: https://github.com/comit-network
    desc: COMIT — an open protocol for trustless cross-chain trading
  - name: DCRDEX / Bison Wallet
    url: https://github.com/decred/dcrdex
    desc: Decentralized exchange powered by atomic swaps with no KYC, no fees
  - name: Thorchain
    url: https://thorchain.org/
    desc: Cross-chain liquidity protocol (AMM-based, not atomic swap)
  - name: Lightning Labs Loop
    url: https://github.com/lightninglabs/loop
    desc: Submarine swaps between on-chain and Lightning
  - name: xmr-btc-swap
    url: https://github.com/comit-network/xmr-btc-swap
    desc: Trustless Monero-Bitcoin atomic swap
  - name: Farcaster Node
    url: https://github.com/farcaster-project/farcaster-node
    desc: Microservice-based Bitcoin-Monero atomic swap node
  - name: Serai
    url: https://github.com/serai-dex/serai
    desc: DEX architecture for BTC, ETH, DAI, and XMR using threshold multisig and
      swap cryptography
  - name: Mintlayer
    url: https://www.mintlayer.org/
    desc: Bitcoin-compatible chain with native atomic swaps on mainnet (January 2026)
- title: 'Atomic Swaps: Privacy-Preserving DEXs'
  items:
  - name: Bisq
    url: https://docs.bisq.network/exchange/whitepaper.html
    desc: Open-source P2P Bitcoin exchange using Tor, multisig deposits, and decentralized
      dispute resolution
  - name: Haveno
    url: https://github.com/haveno-dex/haveno
    desc: Monero-and-Tor-based decentralized P2P exchange for fiat and crypto trades
  - name: Penumbra
    url: https://github.com/penumbra-zone/penumbra
    desc: Fully shielded Cosmos zone for private staking, swaps, and market making
  - name: BasicSwap DEX
    url: https://github.com/basicswap/basicswap/
    desc: Peer-to-peer atomic-swap DEX with decentralized order book and no accounts
  - name: eigenwallet
    url: https://github.com/UnstoppableSwap/core
    desc: Monero-Bitcoin DEX formerly known as UnstoppableSwap, built around atomic
      swaps
  - name: RoboSats
    url: https://github.com/RoboSats/robosats
    desc: Private Lightning-based peer-to-peer Bitcoin exchange using Tor and hold
      invoices
- title: 'Atomic Swaps: Privacy Analysis'
  items:
  - name: Atomic swap privacy
    url: https://eprint.iacr.org/2020/1462.pdf
    desc: On the privacy of atomic swaps and cross-chain transactions
  - name: Breaking Atomic Swaps
    url: https://eprint.iacr.org/2019/877.pdf
    desc: Privacy analysis of HTLC-based atomic swap protocols
  - name: Monero's Decentralized P2P Exchanges
    url: https://arxiv.org/abs/2505.02392
    desc: Kopyciok, Victor, Schmid (2025) — compares Haveno, Bisq, BasicSwap, COMIT,
      and privacy risks
- title: 'CoinJoin: CoinJoin Implementations'
  items:
  - name: Wasabi Wallet
    url: https://wasabiwallet.io/
    desc: Privacy-focused Bitcoin wallet with Chaumian CoinJoin
    status: caution
    note: zkSNACKs ended its CoinJoin coordinator in June 2024; Wasabi now relies
      on third-party coordinators.
  - name: Wasabi Wallet GitHub
    url: https://github.com/zkSNACKs/WalletWasabi
    desc: Open source .NET implementation
  - name: WabiSabi protocol
    url: https://eprint.iacr.org/2021/387
    desc: Flexible CoinJoin with blind signatures, not just equal-output
  - name: WalletWasabi/WabiSabi
    url: https://github.com/WalletWasabi/WabiSabi
    desc: Anonymous credential scheme and protocol materials for coordinated CoinJoin
      transactions
  - name: JoinMarket
    url: https://github.com/JoinMarket-Org/joinmarket-clientserver
    desc: Decentralized CoinJoin marketplace — market makers earn fees
  - name: Jam
    url: https://github.com/joinmarket-webui/jam
    desc: Web UI for JoinMarket
  - name: Whirlpool
    url: https://github.com/Samourai-Wallet/Whirlpool
    desc: Chaumian CoinJoin implementation based on modified ZeroLink theory
    status: defunct
    note: Whirlpool coordinator went offline with the Samourai seizure in April 2024.
- title: 'CoinJoin: Payjoin (P2EP)'
  items:
  - name: 'BIP 78: Payjoin'
    url: https://github.com/bitcoin/bips/blob/master/bip-0078.mediawiki
    desc: 'Pay-to-endpoint: receiver contributes inputs to a payment transaction'
  - name: Payjoin Dev Kit
    url: https://payjoindevkit.org/
    desc: Tools for integrating Payjoin into wallets
  - name: 'BIP 77: Async Payjoin'
    url: https://github.com/bitcoin/bips/blob/master/bip-0077.md
    desc: Payjoin v2 using encrypted store-and-forward directory servers and OHTTP
  - name: Payjoin v2 Guide
    url: https://github.com/payjoin/payjoin.org/blob/master/docs/how-it-works/payjoin-v2-bip-77.md
    desc: Implementation-oriented explanation of asynchronous Payjoin
  - name: payjoin
    url: https://github.com/payjoin/rust-payjoin
    desc: Rust library for BIP 78 Payjoin
- title: 'CoinJoin: Bitcoin Privacy Tools'
  items:
  - name: Samourai Wallet
    url: https://samouraiwallet.com/
    desc: 'Privacy toolkit with Stonewall, Ricochet (note: developers arrested 2024)'
    status: defunct
    note: Seized by US authorities in April 2024; the developers later pleaded guilty.
  - name: Silent Payments (BIP 352)
    url: https://github.com/bitcoin/bips/blob/master/bip-0352.mediawiki
    desc: Reusable payment codes without address reuse
  - name: BIP352 Index Server Specification
    url: https://github.com/silent-payments/bIP0352-index-server-specification
    desc: Work-in-progress API spec for Silent Payments wallet scanning services
  - name: 'BIP 47: Reusable Payment Codes'
    url: https://github.com/bitcoin/bips/blob/master/bip-0047.mediawiki
    desc: Payment codes for static payment addresses
  - name: Sparrow Wallet
    url: https://github.com/sparrowwallet/sparrow
    desc: Desktop Bitcoin wallet focused on security, privacy, and coin control
  - name: Ashigaru
    url: https://ashigaru.rs/
    desc: Open-source privacy-first Bitcoin wallet forked from Samourai Wallet (Tor-only)
- title: 'CoinJoin: Privacy Research'
  items:
  - name: Bitcoin Privacy wiki
    url: https://en.bitcoin.it/wiki/Privacy
    desc: Comprehensive Bitcoin privacy guide
  - name: CoinJoin research
    url: https://www.researchgate.net/publication/337904845_An_Analysis_of_Bitcoin%27s_CoinJoin_Transactions
    desc: Academic analysis of CoinJoin transaction patterns
- title: 'Marketplaces: P2P Exchanges'
  items:
  - name: Haveno Reto
    url: https://github.com/retoaccess1/haveno-reto
    desc: Community Haveno network distribution for Monero-and-Tor-based P2P exchange
  - name: Bisq
    url: https://bisq.network/
    desc: Decentralized P2P Bitcoin exchange network using Tor and local payment methods
- title: 'Marketplaces: Private Marketplaces'
  items:
  - name: OpenBazaar
    url: https://openbazaar.org/
    desc: Decentralized marketplace project planning a 3.0 relaunch after the original
      shutdown
    status: caution
    note: The original OpenBazaar network shut down in 2021; relaunch plans are unproven.
  - name: OpenBazaar Haven
    url: https://github.com/OpenBazaar/haven
    desc: Mobile app for the original OpenBazaar decentralized marketplace network
    status: archived
    note: Client for the original OpenBazaar network, which shut down in 2021.
  - name: Particl Desktop
    url: https://github.com/particl/particl-desktop
    desc: GUI for Particl Marketplace and PART wallet focused on private peer-to-peer
      commerce
  - name: Particl Core
    url: https://github.com/particl/particl-core
    desc: Privacy coin and platform backend for Particl's decentralized marketplace
      ecosystem
- title: 'Lightning: Lightning Network'
  items:
  - name: Lightning Network
    url: https://lightning.network/
    desc: Bitcoin Layer-2 payment channel network for instant off-chain transactions
  - name: Lightning Labs
    url: https://lightninglabs.com/
    desc: Company building Lightning infrastructure (LND, Loop, Pool, Taproot Assets)
  - name: LND v0.20
    url: https://lightning.engineering/posts/2025-12-03-lnd-0.20-launch/
    desc: Latest LND release with sqlite/postgres channel graph, enhanced gossip rate
      limits (December 2025)
  - name: Core Lightning (CLN)
    url: https://github.com/ElementsProject/lightning
    desc: Blockstream's Lightning implementation in C
  - name: LND
    url: https://github.com/lightningnetwork/lnd
    desc: Lightning Network Daemon by Lightning Labs
  - name: Eclair
    url: https://github.com/ACINQ/eclair
    desc: ACINQ's Scala Lightning implementation
  - name: LDK
    url: https://github.com/lightningdevkit/rust-lightning
    desc: Lightning Development Kit — modular library for building Lightning nodes
  - name: BOLT Specifications
    url: https://github.com/lightning/bolts
    desc: Basis of Lightning Technology protocol specifications
  - name: 'BOLT 2: Peer Protocol'
    url: https://github.com/lightning/bolts/blob/master/02-peer-protocol.md
    desc: Channel management spec covering v2 channels, dual funding, and splicing
  - name: Lightning Pool
    url: https://github.com/lightninglabs/pool
    desc: Marketplace for Lightning channel leases
  - name: Mutiny Wallet
    url: https://github.com/MutinyWallet/mutiny-node
    desc: Tiny Lightning node that runs in the browser via WASM
    status: defunct
    note: Mutiny announced the shutdown of its hosted wallet and mobile apps; the
      remaining option is self-hosting.
  - name: Phoenix
    url: https://phoenix.acinq.co/
    desc: Self-custodial Lightning wallet with BOLT 12 support
  - name: BOLT 12 Tracker
    url: https://bolt12.org/
    desc: Track BOLT 12 adoption across wallets and Lightning implementations
  - name: Twelve Cash
    url: https://twelve.cash/
    desc: BOLT 12 offers with human-readable usernames via DNS for Core Lightning
  - name: Lightning Node Comparison
    url: https://www.spark.money/tools/lightning-node-comparison
    desc: Detailed comparison of LND vs CLN vs LDK vs Eclair
- title: 'Lightning: Discreet Log Contracts (DLCs)'
  items:
  - name: DLC.spec
    url: https://github.com/discreetlogcontracts/dlcspecs
    desc: Discreet Log Contracts specification
  - name: DLCs on Lightning
    url: https://adiabat.github.io/dlc.pdf
    desc: Original paper by Tadge Dryja (2018)
  - name: DLC Markets
    url: https://dlcmarkets.com/
    desc: Bitcoin-native derivatives platform using DLCs
- title: 'Lightning: Lightning Privacy'
  items:
  - name: 'BOLT 4: Onion Routing'
    url: https://github.com/lightning/bolts/blob/master/04-onion-routing.md
    desc: Sphinx-based onion routing for Lightning payments
  - name: Route Blinding (BOLT 4)
    url: https://github.com/lightning/bolts/pull/765
    desc: Recipient privacy via blinded paths
- title: 'Lightning: Lightning Splicing & Swaps'
  items:
  - name: LND Liquidity Ads Issue
    url: https://github.com/lightningnetwork/lnd/issues/6569
    desc: Tracking native dual-funded channel / liquidity ads support in LND
  - name: Lightning Splicing
    url: https://www.youtube.com/watch?v=XowFGg-jwH8
    desc: YouTube explanation of Lightning splicing by Dusty Daemon
  - name: Boltz Exchange
    url: https://boltz.exchange/
    desc: Atomic non-custodial swaps between Lightning and other Bitcoin layers
  - name: Boltz USDT Swaps
    url: https://bitcoinmagazine.com/business/boltz-exchange-launches-atomic-usdt-swaps-for-lightning-network-users
    desc: Atomic USDT swaps for Lightning (March 2026)
- title: 'Liquid: Liquid Network'
  items:
  - name: Liquid Network
    url: https://liquid.net/
    desc: Blockstream's Bitcoin sidechain with confidential transactions
  - name: Liquid Blog
    url: https://blog.liquid.net/
    desc: Official blog with updates and technical articles
  - name: Liquid Docs
    url: https://docs.liquid.net/
    desc: Official documentation
  - name: Elements Project
    url: https://github.com/ElementsProject/elements
    desc: Open-source Liquid sidechain platform codebase
  - name: Blockstream Green
    url: https://blockstream.com/green/
    desc: Wallet supporting Liquid assets
  - name: Liquid Asset Registry
    url: https://assets.liquid.net/
    desc: Registry of issued assets on Liquid
  - name: awesome-liquid-network
    url: https://github.com/aljazceru/awesome-liquid-network
    desc: Curated directory of Liquid resources, libraries, tools, wallets, and applications
- title: 'Liquid: Confidential Transactions'
  items:
  - name: Confidential Transactions
    url: https://elementsproject.org/features/confidential-transactions
    desc: How Liquid hides transaction amounts using Bulletproofs
  - name: Bulletproofs paper
    url: https://eprint.iacr.org/2017/1066.pdf
    desc: Bünz et al. (2018) — short proofs for confidential values
  - name: Greg Maxwell's CT proposal
    url: https://bitcointalk.org/index.php?topic=1078201.0
    desc: Original Confidential Transactions concept (2015)
  - name: Everyday Guide to Confidential Transactions
    url: https://blog.liquid.net/guide-to-confidential-transactions/
    desc: Technical deep-dive on how CT works on Liquid
  - name: Elements CT Tutorial
    url: https://elementsproject.org/elements-code-tutorial/confidential-transactions
    desc: Hands-on Elements walkthrough for blinded addresses and confidential transfers
- title: 'Liquid: Liquid Development Libraries'
  items:
  - name: go-elements
    url: https://github.com/vulpemventures/go-elements
    desc: Go library for Liquid/Elements transactions and confidential transaction
      primitives
  - name: rust-elements
    url: https://github.com/ElementsProject/rust-elements
    desc: Rust library for Elements transaction and block serialization
  - name: libwally-core
    url: https://github.com/ElementsProject/libwally-core
    desc: Cross-platform wallet primitives with Elements support
  - name: Liquid Wallet Kit
    url: https://github.com/Blockstream/lwk
    desc: Blockstream Rust toolkit for building Liquid wallets and applications
- title: 'Liquid: Liquid Wallets & Apps'
  items:
  - name: Marina Wallet
    url: https://github.com/vulpemventures/marina
    desc: Browser extension wallet for Liquid assets
  - name: AQUA Wallet
    url: https://aquawallet.io/
    desc: Non-custodial Bitcoin and Liquid wallet for bitcoin, L-BTC, and stablecoins
  - name: SideSwap
    url: https://sideswap.io/
    desc: Non-custodial Liquid wallet and peer-to-peer asset swap platform
- title: 'Liquid: Issued Assets on Liquid'
  items:
  - name: Tether on Liquid
    url: https://tether.to/en/
    desc: USDt natively issued on Liquid Network
  - name: Hadron by Tether
    url: https://hadron.tether.to/it/blog/liquid-network-fast-confidential-rwa-tokenization-with-hadron-by-tether
    desc: RWA tokenization platform on Liquid
  - name: Liquid Securities
    url: https://securities.liquid.net/
    desc: Security token framework on Liquid
- title: Shielded Payments
  items:
  - name: Zcash
    url: https://z.cash/learn/what-is-the-difference-between-shielded-and-transparent-zcash/
    desc: Official explanation of transparent and shielded Zcash payments
  - name: Zcash protocol specification
    url: https://zips.z.cash/protocol/protocol.pdf
    desc: Shielded pools, notes, viewing keys and transaction rules
  - name: Orchard (ZIP 224)
    url: https://zips.z.cash/zip-0224
    desc: Halo 2 shielded protocol without a trusted setup; pool-boundary privacy
      limits
- title: Federated Ecash
  items:
  - name: Fedimint
    url: https://fedimint.org/
    desc: Federated Bitcoin custody, Chaumian ecash and Lightning payments
  - name: Fedimint guardian architecture
    url: https://fedimint.org/guardians/how-federations-work
    desc: Threshold custody, guardian consensus and Lightning gateway contracts
- title: Payment Processing
  items:
  - name: BTCPay Server
    url: https://btcpayserver.org/
    desc: Self-hosted payment processor with invoices and direct wallet payments
  - name: BTCPay wallet documentation
    url: https://docs.btcpayserver.org/FAQ/Wallet/
    desc: Extended public keys, invoice addresses and address gap limits
- title: Silent Payments
  items:
  - name: BIP 352 reference implementation
    url: https://github.com/bitcoin/bips/blob/master/bip-0352/reference.py
    desc: Python reference for sending, receiving and scanning Silent Payments
  - name: Cake Wallet Silent Payments
    url: https://docs.cakewallet.com/features/privacy-and-security/silent-payments
    desc: Sending, receiving, scanning costs and the scanning-server fallback
