pillar: zk
sections:
- title: Zero-Knowledge Proof Systems
  items:
  - name: zk-SNARKs
    url: https://eprint.iacr.org/2019/099.pdf
    desc: Succinct Non-Interactive Arguments of Knowledge — compact proofs verifiable
      in milliseconds
  - name: Bulletproofs
    url: https://eprint.iacr.org/2017/1066.pdf
    desc: Short proofs for confidential values without trusted setup (Bünz et al.,
      2018)
  - name: Circom & SnarkJS
    url: https://github.com/iden3/circom
    desc: Domain-specific language and toolchain for writing and verifying zk-SNARK
      circuits
  - name: Arkworks
    url: https://github.com/arkworks-rs
    desc: Rust ecosystem for programming and composing zk-SNARK protocols
  - name: Zilch
    url: https://github.com/TrustworthyComputing/Zilch
    desc: STARK framework for scalable, transparent zero-knowledge arguments without
      trusted setup
- title: ZK Rollups & Scaling
  items:
  - name: zkSync Era
    url: https://github.com/matter-labs/zksync-era
    desc: ZK rollup on Ethereum supporting smart contracts with native account abstraction
  - name: Scroll
    url: https://scroll.io/
    desc: Bytecode-level compatible ZK rollup for Ethereum using proof of correctness
  - name: Polygon zkEVM
    url: https://github.com/0xPolygonHermez/zkevm-rom
    desc: Open-source ZK rollup offering EVM equivalence
  - name: Starknet
    url: https://starknet.io/
    desc: Layer-2 network using STARK proofs for scalable dApp computation
  - name: Starknet 2025 Review
    url: https://www.starknet.io/blog/starknet-2025-year-in-review/
    desc: BTC staking, BTCFi, and privacy developments
  - name: Mina Protocol
    url: https://minaprotocol.com/
    desc: Minimal-blockchain using recursive SNARKs to maintain a constant 22KB chain
  - name: Taiko
    url: https://taiko.xyz/
    desc: Fully decentralized Ethereum-equivalent ZK rollup with zero code changes
      for Ethereum dApps
  - name: Taiko Shasta Upgrade
    url: https://coinmarketcap.com/cmc-ai/taiko/latest-updates/
    desc: April 2026 upgrade with up to 22x lower costs for block proposers
  - name: Aztec Network
    url: https://aztec.network/
    desc: Privacy-first ZK rollup with private smart contracts using Noir language
  - name: Linea
    url: https://linea.build/
    desc: ConsenSys zkEVM L2 rollup with EVM-equivalence and native ETH yield (September
      2025 token)
  - name: Manta Network
    url: https://manta.network/
    desc: Modular ZK rollup with Universal Circuits for privacy-preserving applications
- title: Privacy-Focused ZK
  items:
  - name: Aztec Documentation
    url: https://docs.aztec.network/
    desc: Developer guides for private smart contracts on Ethereum's privacy-first
      zkRollup
  - name: Tornado Cash
    url: https://github.com/tornadocash
    desc: 'Non-custodial Ethereum privacy solution using ZK proofs (note: sanctioned
      by OFAC)'
  - name: Nocturne
    url: https://nocturne.xyz/
    desc: Privacy protocol using ZK proofs for shielded Ethereum transactions
  - name: Zcash
    url: https://z.cash/
    desc: Privacy-preserving cryptocurrency using zk-SNARKs (Halo 2)
- title: ZK Identity & Credentials
  items:
  - name: Polygon ID
    url: https://github.com/0xPolygonID
    desc: ZK identity protocol for privacy-preserving verification on blockchain
  - name: zkPass
    url: https://zkpass.io/
    desc: Privacy-preserving identity verification using ZK proofs and TLS
  - name: anon-aadhaar
    url: https://github.com/anon-aadhaar/anon-aadhaar
    desc: ZK protocol to prove possession of Aadhaar (Indian ID) without revealing
      identity
  - name: Semaphore
    url: https://github.com/semaphore-protocol/semaphore
    desc: Generic ZK privacy layer for anonymous group membership proofs and signaling
  - name: MACI
    url: https://github.com/privacy-scaling-explorations/maci
    desc: Minimal Anti-Collusion Infrastructure for private, anti-bribery on-chain
      voting
  - name: Dock Wallet
    url: https://www.dock.io/post/self-sovereign-identity
    desc: Self-sovereign identity platform guide (2026)
- title: ZK Frameworks & Libraries
  items:
  - name: Noir
    url: https://github.com/noir-lang/noir
    desc: Domain-specific language for SNARK circuits with ACIR-compatible proving
      systems
  - name: OpenZeppelin ZK
    url: https://www.openzeppelin.com/zkp
    desc: Secure circuit design and ZK implementation auditing
  - name: Awesome MPC
    url: https://github.com/rdragos/awesome-mpc
    desc: Curated list of multi-party computation resources
  - name: ZK Framework Survey
    url: https://arxiv.org/html/2502.07063v1
    desc: Quantitative benchmarks and developer guide for choosing ZK frameworks
  - name: Rumble Fish ZK Projects
    url: https://www.rumblefish.dev/blog/post/top-zk-projects-2025/
    desc: Top ZK projects reshaping blockchain in 2025
  - name: 'Understanding zk-SNARKs: Research to Practice'
    url: https://eprint.iacr.org/2025/172.pdf
    desc: Comprehensive walk-through for practitioners focusing on usability and library
      selection
  - name: Top Zero-Knowledge ZK Projects 2026
    url: https://coincodex.com/article/77574/best-zero-knowledge-crypto/
    desc: Top ZK crypto projects by market cap
- title: Zero-Knowledge Virtual Machines (zkVM)
  items:
  - name: RISC Zero
    url: https://github.com/risc0/risc0
    desc: Zero-knowledge verifiable general computing platform emulating RISC-V (17K
      stars)
  - name: Jolt
    url: https://github.com/a16z/jolt
    desc: a16z's fast, extensible RISC-V zkVM using sumcheck and lookup arguments
  - name: Nexus zkVM
    url: https://github.com/nexus-xyz/nexus-zkvm
    desc: Modular, prover-optimized zkVM written in Rust (3.5K stars)
  - name: SP1
    url: https://github.com/succinctlabs/sp1
    desc: Succinct's zkVM achieving real-time Ethereum proving (4.5K stars)
  - name: OpenVM
    url: https://github.com/openvm-org/openvm
    desc: Modular zkVM framework for custom instructions, Rust frontends, and Ethereum
      verification
  - name: Valida zkVM
    url: https://github.com/valida-xyz/valida
    desc: Archived STARK-based zkVM focused on code reuse, performance, and modularity
  - name: awesome-zkvm
    url: https://github.com/rkdud007/awesome-zkvm
    desc: Curated list of zkVM projects and resources
- title: Ethereum Privacy Tooling
  items:
  - name: Kohaku Wallet
    url: https://github.com/ethereum/kohaku-extension
    desc: Ethereum Foundation reference wallet embedding on-chain privacy through
      the Kohaku SDK
  - name: Kohaku
    url: https://github.com/ethereum/kohaku
    desc: Ethereum Foundation privacy-first tooling monorepo for Railgun, Privacy
      Pools, provider abstraction, and PQ accounts
  - name: Privacy Pools Core
    url: https://github.com/0xbow-io/privacy-pools-core
    desc: ZK contracts, circuits, relayer, and SDK for approved-set private Ethereum
      transfers
  - name: Privacy Pools
    url: https://github.com/ameensol/privacy-pools
    desc: Ethereum privacy pool prototype using zero-knowledge proofs and association
      sets
- title: Resources
  items:
  - name: Awesome Zero-Knowledge Proofs
    url: https://github.com/matter-labs/awesome-zero-knowledge-proofs
    desc: Curated list of ZKP implementations, libraries, and educational resources
  - name: ZK learning resources from 0xPARC
    url: https://learn.0xparc.org/
    desc: Educational materials for learning ZK cryptography
  - name: awesome-zk
    url: https://github.com/ventali/awesome-zk
    desc: Curated directory of ZK projects, libraries, tools, and learning resources
  - name: web3privacy
    url: https://github.com/web3privacy/web3privacy
    desc: Market overview of privacy-preserving Web3 protocols, wallets, infrastructure,
      and research
- title: General-purpose Proofs
  items:
  - name: RISC Zero receipts
    url: https://dev.risczero.com/api/zkvm/receipts
    desc: Program image IDs, public journals and proof verification
  - name: SP1 security model
    url: https://docs.succinct.xyz/docs/sp1/security/security-model
    desc: Program safety, proof assumptions and which proof modes provide zero knowledge
- title: Web Provenance
  items:
  - name: TLSNotary
    url: https://tlsnotary.org/docs/intro/
    desc: MPC-TLS, selective disclosure and the trust placed in a notary
