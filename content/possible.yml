title: "What's Possible"
dek: "A map of what you can actually do today by combining the technologies in this library. Each capability is a real goal; the steps under it are working building blocks, each linking to its entry. Nothing here is theoretical unless its readiness says so."
intro: "People often do not act on freedom technology because they do not know it exists, or cannot see how the pieces fit together. This page is the opposite of a product pitch: it starts from things you might want to do, and shows the primitives — already documented here — that compose into each one. Filter by pillar, or just explore."
scenarios:
  - key: talk
    goal: "Talk without being overheard — or traced"
    dek: "Keep both the contents and the pattern of your conversations away from anyone watching the network."
    pillars: [messaging, anonymity]
    blocks: [threat-modeling, choosing-a-secure-messenger, compare-messengers, signal-protocol, white-noise, delta-chat, xmpp-omemo, jami, metadata-resistance, cover-traffic, mix-networks, nym]
  - key: dark
    goal: "Stay connected when the network goes dark"
    dek: "Communicate when the internet is shut off, throttled or simply absent, using radios and local-first networks."
    pillars: [mesh, circumvention]
    blocks: [internet-shutdown-preparedness, off-grid-networks, building-a-mesh, meshtastic, meshcore, bitchat, reticulum, community-networks, kiwix, libremesh, community-wifi-network, aprs, delay-tolerant-networking, satellite-broadband]
  - key: firewall
    goal: "Reach the internet through censorship"
    dek: "Reach the open internet from inside censorship, and help others do the same."
    pillars: [circumvention, anonymity]
    blocks: [censorship-circumvention, ooni, pluggable-transports, psiphon, outline, wireguard, self-hosted-circumvention-server, map-censorship-resistance, tor, using-tor-safely, i2p, dnscrypt, mullvad-vpn]
  - key: publish
    goal: "Publish what cannot be taken down"
    dek: "Put words or files online so that no host, registrar or court can quietly erase them."
    pillars: [storage, naming]
    blocks: [uncensorable-website, nostr-protocol, ipfs-and-filecoin, arweave, decentralized-storage, compare-storage, ipns-dnslink, bittorrent-archives, secure-scuttlebutt]
  - key: money
    goal: "Hold and move money with a clear trust model"
    dek: "Choose self-custody, compare peer-to-peer acquisition, and understand what shielded payments and custodial ecash protect."
    pillars: [money]
    blocks: [financial-sovereignty, bitcoin-self-custody, hardware-wallets, compare-p2p-bitcoin-acquisition, bisq, robosats, lightning-network, monero, zcash, silent-payments, cashu-ecash, fedimint, btcpay-server, blockstream-satellite, stablecoins-and-sovereignty]
  - key: identity
    goal: "Carry an identity you own"
    dek: "Prove who you are across services with keys and reputation you control, not an account someone can revoke."
    pillars: [identity, naming]
    blocks: [decentralized-identity, nostr-identity, nostr-key-custody, remote-signing, web-of-trust, verifiable-credentials, proof-of-personhood, biscuit]
  - key: naming
    goal: "Name things without a registrar"
    dek: "Own a human-readable name that no central authority issued and none can seize."
    pillars: [naming]
    blocks: [decentralized-dns, handshake, ens, gnu-name-system, pkarr, sovereign-name-lifecycle]
  - key: compute
    goal: "Compute on data the operator cannot read"
    dek: "Run workloads on someone else's hardware without that host seeing your inputs or your results."
    pillars: [confidential, compute]
    blocks: [confidential-computing, remote-attestation, confidential-ai-inference, fully-homomorphic-encryption, private-information-retrieval, tee-state-and-revocation, compare-fhe-libraries, compare-decentralized-compute]
  - key: prove
    goal: "Prove something without revealing it"
    dek: "Convince someone a statement is true while disclosing nothing beyond the statement itself."
    pillars: [zk, identity]
    blocks: [zero-knowledge-proofs, zk-privacy-applications, semaphore, bbs-signatures, zkemail]
  - key: device
    goal: "Harden the device in your hands"
    dek: "Make the phone or laptop you actually use resistant to spyware, seizure and tampering."
    pillars: [endpoint]
    blocks: [threat-modeling, grapheneos, tails-qubes-whonix, hardware-supply-chain-trust, heads-firmware, encrypting-files-and-backups, passkeys-and-security-keys, mobile-location-privacy, verifying-software]
  - key: quantum
    goal: "Keep secrets safe from a future quantum computer"
    dek: "Protect today's encrypted data against an adversary who stores it now to break it later."
    pillars: [pqc, cryptography]
    blocks: [post-quantum-cryptography, ml-kem, ml-dsa, hybrid-kem-migration, pqc-cryptographic-inventory]
  - key: run
    goal: "Run the infrastructure others depend on"
    dek: "Operate relays, nodes and networks so they keep working through outages, seizure and censorship."
    pillars: [mesh, anonymity, circumvention]
    blocks: [running-freedom-infrastructure, self-hosted-circumvention-server, pluggable-transports, resilient-infrastructure, community-networks, openwrt, tor, nostr-protocol, cordn, xmpp-omemo]
  - key: keep-files
    goal: "Keep working files and a way to recover them"
    dek: "Sync chosen devices, assess encrypted storage, and maintain a separate offline archive."
    pillars: [storage, cryptography]
    blocks: [compare-storage, private-file-sync-and-backup, syncthing, tahoe-lafs, encrypting-files-and-backups, local-first-crdts, hypercore, kiwix, magic-wormhole, cryptpad]
  - key: confidential-submissions
    goal: "Receive documents from a confidential source"
    dek: "Choose an onion-service submission tool, understand who sees plaintext, and plan how documents will be opened safely."
    pillars: [anonymity, storage, endpoint]
    blocks: [threat-modeling, using-tor-safely, onionshare, securedrop, tails-qubes-whonix, encrypting-files-and-backups]
  - key: documents
    goal: "Prepare documents for safer reading and sharing"
    dek: "Use isolated conversion, metadata cleanup and proper redaction, then inspect the file you will send."
    pillars: [endpoint]
    blocks: [dangerzone, sanitizing-documents, tails-qubes-whonix, encrypting-files-and-backups]
  - key: compromise
    goal: "Respond to a suspected device compromise"
    dek: "Move sensitive activity to a trusted device, preserve evidence and get help planning recovery."
    pillars: [endpoint]
    blocks: [suspected-device-compromise, threat-modeling, passkeys-and-security-keys, grapheneos]
  - key: self-host
    goal: "Run your own personal server"
    dek: "Compare server operating systems and plan application trust, remote access, updates and recoverable backups."
    pillars: [endpoint, compute]
    blocks: [startos, yunohost, openwrt, encrypting-files-and-backups, running-freedom-infrastructure]
  - key: private-query
    goal: "Query without revealing your interest"
    dek: "Decide whether to hide the requested item, the request's network origin, or both, and check the assumptions of each layer."
    pillars: [cryptography, anonymity]
    blocks: [private-information-retrieval, pir-use-cases, oblivious-http]
  - key: joint-compute
    goal: "Compute jointly without pooling data"
    dek: "Choose who contributes inputs, who may learn the result and which collusion or key-custody assumptions the computation needs."
    pillars: [cryptography]
    blocks: [multi-party-computation, private-set-intersection, fully-homomorphic-encryption, compare-private-computation]
  - key: timed-release
    goal: "Release encrypted material after a chosen time"
    dek: "Understand the threshold beacon that controls release timing and add recipient encryption when access must remain restricted."
    pillars: [cryptography, storage]
    blocks: [drand-tlock, age-encryption, threshold-signatures, verifiable-delay-functions]
