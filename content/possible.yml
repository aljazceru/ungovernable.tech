title: "What's Possible"
dek: "A map of what you can actually do today by combining the technologies in this library. Each capability is a real goal; the steps under it are working building blocks, each linking to its entry. Nothing here is theoretical unless its readiness says so."
intro: "People often do not act on freedom technology because they do not know it exists, or cannot see how the pieces fit together. This page is the opposite of a product pitch: it starts from things you might want to do, and shows the primitives — already documented here — that compose into each one. Filter by pillar, or just explore."
scenarios:
  - key: talk
    goal: "Talk without being overheard — or traced"
    dek: "Keep both the contents and the pattern of your conversations away from anyone watching the network."
    pillars: [messaging, anonymity]
    blocks: [threat-modeling, choosing-a-secure-messenger, signal-protocol, white-noise, metadata-resistance, cover-traffic, mix-networks, nym]
  - key: dark
    goal: "Stay connected when the network goes dark"
    dek: "Communicate when the internet is shut off, throttled or simply absent, using radios and local-first networks."
    pillars: [mesh, circumvention]
    blocks: [internet-shutdown-preparedness, off-grid-networks, building-a-mesh, meshtastic, reticulum, community-networks]
  - key: firewall
    goal: "Get through a firewall or a blackout"
    dek: "Reach the open internet from inside censorship, and help others do the same."
    pillars: [circumvention, anonymity]
    blocks: [censorship-circumvention, map-censorship-resistance, tor, using-tor-safely, i2p]
  - key: publish
    goal: "Publish what cannot be taken down"
    dek: "Put words or files online so that no host, registrar or court can quietly erase them."
    pillars: [storage, naming]
    blocks: [uncensorable-website, nostr-protocol, ipfs-and-filecoin, arweave, decentralized-storage]
  - key: money
    goal: "Hold and move money nobody can freeze"
    dek: "Custody and transact value without a bank or payment processor able to block or reverse it."
    pillars: [money]
    blocks: [financial-sovereignty, bitcoin-self-custody, hardware-wallets, lightning-network, monero, cashu-ecash]
  - key: identity
    goal: "Carry an identity you own"
    dek: "Prove who you are across services with keys and reputation you control, not an account someone can revoke."
    pillars: [identity, naming]
    blocks: [decentralized-identity, nostr-identity, web-of-trust, verifiable-credentials, proof-of-personhood]
  - key: naming
    goal: "Name things without a registrar"
    dek: "Own a human-readable name that no central authority issued and none can seize."
    pillars: [naming]
    blocks: [decentralized-dns, handshake, ens, gnu-name-system, pkarr]
  - key: compute
    goal: "Compute on data the operator cannot read"
    dek: "Run workloads on someone else's hardware without that host seeing your inputs or your results."
    pillars: [confidential, compute]
    blocks: [confidential-computing, remote-attestation, confidential-ai-inference, fully-homomorphic-encryption, private-information-retrieval]
  - key: prove
    goal: "Prove something without revealing it"
    dek: "Convince someone a statement is true while disclosing nothing beyond the statement itself."
    pillars: [zk, identity]
    blocks: [zero-knowledge-proofs, zk-privacy-applications, semaphore, bbs-signatures, zkemail]
  - key: device
    goal: "Harden the device in your hands"
    dek: "Make the phone or laptop you actually use resistant to spyware, seizure and tampering."
    pillars: [endpoint]
    blocks: [threat-modeling, grapheneos, tails-qubes-whonix, hardware-supply-chain-trust, encrypting-files-and-backups]
  - key: quantum
    goal: "Keep secrets safe from a future quantum computer"
    dek: "Protect today's encrypted data against an adversary who stores it now to break it later."
    pillars: [pqc, cryptography]
    blocks: [post-quantum-cryptography, ml-kem, ml-dsa, hybrid-kem-migration]
  - key: run
    goal: "Run the infrastructure others depend on"
    dek: "Operate relays, nodes and networks so they keep working through outages, seizure and censorship."
    pillars: [mesh, anonymity]
    blocks: [running-freedom-infrastructure, resilient-infrastructure, community-networks, tor, nostr-protocol, cordn]
