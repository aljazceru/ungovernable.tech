cashu-ecash: "Cashu brings Chaumian ecash to Bitcoin: blind-signed bearer tokens that give near-cash payment privacy, in exchange for trusting the mint with custody."
coinjoin: "CoinJoin and Payjoin break the assumption that all inputs of a Bitcoin transaction belong to one person: implementations, trade-offs and legal context."
concord-protocol: "Concord, an open MIT-licensed specification for end-to-end encrypted communities on Nostr: its design, how it uses MLS ideas, and its maturity."
