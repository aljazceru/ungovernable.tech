# Hand-written meta descriptions for vault entries (110-160 chars). The importer prefers these over synthesised ones.
aethir: "Aethir, an enterprise-oriented decentralized GPU cloud: how its marketplace works, who supplies the hardware, and what users actually have to trust."
age-encryption: "age is a small, modern file-encryption tool built on X25519 and ChaCha20-Poly1305: how it works, how to use it, and where it beats PGP for files."
ai-agent-identity-nostr: "How AI agents get cryptographic identities on Nostr: key pairs for non-human actors, delegation, payments and the trust questions this raises."
akash: "Akash Network, an open-source decentralized cloud: a reverse-auction marketplace for container workloads and GPUs, its trust model and its limits."
apple-secure-enclave: "Apple's Secure Enclave, the isolated security processor inside every modern Apple chip: what it protects, how it is attested, and what it cannot do."
arm-cca: "Arm Confidential Compute Architecture adds Realms, hardware-isolated VMs, to Arm chips: how CCA works, how it compares with TDX and SEV-SNP, and its status."
arweave: "Arweave, a permanent storage network funded by a one-time payment: how the blockweave and endowment work, and what permanence really guarantees."
at-protocol: "Bluesky's AT Protocol identity model: portable signed repositories anchored to did:plc or did:web, and how much of it depends on Bluesky itself."
authenticated-data-structures: "Merkle trees, accumulators and vector commitments: data structures that let anyone verify membership or non-membership against a short digest."
bacalhau: "Bacalhau and compute-over-data: moving jobs to where data lives instead of moving data to the compute, and how it underpins decentralized networks."
batman-adv-and-cjdns: "Two long-running approaches to mesh routing compared: B.A.T.M.A.N. advanced for local Layer 2 meshes and cjdns for encrypted IPv6 overlay networks."
bbs-signatures: "BBS+ signatures let a credential holder reveal only chosen attributes and prove the rest in zero knowledge: the scheme behind private verifiable credentials."
bitchat: "Bitchat relays end-to-end encrypted messages between phones over a Bluetooth mesh, with a Nostr fallback: no accounts, no phone numbers, no servers."
bitcoin-post-quantum-migration: "Why a large quantum computer would break Bitcoin's signatures, which coins are most exposed, and the proposals for migrating to post-quantum keys."
bittensor: "Bittensor, a token-incentivised network of AI subnets where miners produce inference and validators score them: how it works and what it rewards."
bitvm: "BitVM lets Bitcoin verify arbitrary computation through fraud proofs, without a soft fork: how it works, what it enables for bridges, and its costs."
blossom: "Blossom stores files addressed by SHA-256 hash on ordinary HTTP servers, with Nostr keys for authorisation: simple, mirrorable blob storage for Nostr."
briar: "Briar is a peer-to-peer messenger built for shutdowns and hostile networks: it syncs over Tor, Bluetooth and Wi-Fi, with no servers holding your messages."
buzz: "Buzz, a self-hostable system that gives AI agents their own Nostr key pairs and identities: a production example of non-human actors on Nostr."
